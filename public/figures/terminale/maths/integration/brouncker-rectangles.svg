<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 330" width="430" height="330" role="img" aria-label="Dans un repère, la courbe de la fonction inverse, y = 1/x, descend du point (1 ; 1) au point (2 ; 0,5). Sous la courbe, entre x = 1 et x = 2, des rectangles empilés sans se chevaucher. Rectangle 1, en bleu : sur [1 ; 2], de hauteur 0,5. Rectangle 2, en vert, posé sur le rectangle 1 : sur [1 ; 1,5], de 0,5 jusqu'à 2/3. Rectangle 3, en orange, posé sur le rectangle 2 : sur [1 ; 1,25], de 2/3 jusqu'à 4/5. Rectangle 4, en orange, posé sur le rectangle 1 : sur [1,5 ; 1,75], de 0,5 jusqu'à 4/7. Le coin en haut à droite de chaque rectangle touche la courbe. En gris, quatre rectangles plus fins, de largeur 0,125, comblent l'étape suivante.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Repère orthogonal : origine (40, 300) ; 160 px par unité en abscisse, 240 px par unité en ordonnée. -->
  <!-- Courbe y = 1/x de x = 0,9 à x = 2,25 : Bézier cubiques d'Hermite (tangentes exactes aux nœuds 1 ; 1,25 ; 1,5 ; 1,75 ; 2), écart à la courbe < 0,04 px. -->
  <!-- Rectangle k : sur la moitié gauche d'une bande, de la hauteur de la pile (1/x au bord droit de la bande) jusqu'à 1/x au bord droit de la moitié. -->
  <!-- 1 : [1 ; 2] × [0 ; 1/2] ; 2 : [1 ; 3/2] × [1/2 ; 2/3] ; 3 : [1 ; 5/4] × [2/3 ; 4/5] ; 4 : [3/2 ; 7/4] × [1/2 ; 4/7]. -->
  <!-- Gris (5 à 8) : [1 ; 9/8] × [4/5 ; 8/9] ; [5/4 ; 11/8] × [2/3 ; 8/11] ; [3/2 ; 13/8] × [4/7 ; 8/13] ; [7/4 ; 15/8] × [1/2 ; 8/15]. -->
  <g fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="1.2"><rect x="200" y="180" width="160" height="120"/></g>
  <g fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="1.2"><rect x="200" y="140" width="80" height="40"/></g>
  <g fill="#ea580c" fill-opacity="0.35" stroke="#ea580c" stroke-width="1.2"><rect x="200" y="108" width="40" height="32"/><rect x="280" y="162.857" width="40" height="17.143"/></g>
  <g fill="#64748b" fill-opacity="0.3" stroke="#64748b" stroke-width="1"><rect x="200" y="86.667" width="20" height="21.333"/><rect x="240" y="125.455" width="20" height="14.545"/><rect x="280" y="152.308" width="20" height="10.549"/><rect x="320" y="172" width="20" height="8"/></g>
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="25" y1="300" x2="420" y2="300"/><polyline points="414,296 420,300 414,304"/><line x1="40" y1="315" x2="40" y2="15"/><polyline points="36,21 40,15 44,21"/></g>
  <g stroke="#334155" stroke-width="1"><line x1="200" y1="297" x2="200" y2="303"/><line x1="240" y1="297" x2="240" y2="303"/><line x1="280" y1="297" x2="280" y2="303"/><line x1="320" y1="297" x2="320" y2="303"/><line x1="360" y1="297" x2="360" y2="303"/><line x1="37" y1="180" x2="43" y2="180"/><line x1="37" y1="60" x2="43" y2="60"/></g>
  <g stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3"><line x1="40" y1="180" x2="200" y2="180"/><line x1="40" y1="60" x2="200" y2="60"/></g>
  <text x="200" y="316" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">1</text>
  <text x="240" y="316" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">1,25</text>
  <text x="280" y="316" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">1,5</text>
  <text x="320" y="316" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">1,75</text>
  <text x="360" y="316" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">2</text>
  <text x="34" y="316" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">O</text>
  <text x="34" y="184" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">0,5</text>
  <text x="34" y="64" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">1</text>
  <text x="417" y="292" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end" font-style="italic">x</text>
  <text x="48" y="23" font-family="Georgia,serif" font-size="12" fill="#475569" font-style="italic">y</text>
  <path d="M 184.00 33.33 C 189.33 43.21 194.67 52.00 200.00 60.00 C 213.33 80.00 226.67 95.20 240.00 108.00 C 253.33 120.80 266.67 131.11 280.00 140.00 C 293.33 148.89 306.67 156.33 320.00 162.86 C 333.33 169.39 346.67 175.00 360.00 180.00 C 373.33 185.00 386.67 189.38 400.00 193.33" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <g font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle"><text x="280" y="244">1</text><text x="240" y="164">2</text><text x="220" y="128">3</text><text x="300" y="175.5">4</text></g>
  <text x="368" y="166" font-family="Georgia,serif" font-size="12" fill="#0f172a">y = 1/x</text>
</svg>
