<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 310" width="320" height="310" role="img" aria-label="Dans un repère orthonormé, la parabole d'équation y = x² pour x entre 0 et 1. L'intervalle [0 ; 1] est coupé en quatre intervalles de largeur 0,25. Sur chacun, un rectangle vert, dont la hauteur est la valeur de x² au bord gauche, reste sous la courbe ; un rectangle orange, plus haut, dont la hauteur est la valeur de x² au bord droit, dépasse la courbe. Les hauteurs vertes valent 0 ; 0,0625 ; 0,25 et 0,5625 ; les hauteurs orange valent 0,0625 ; 0,25 ; 0,5625 et 1.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Repère : origine (40, 280) ; 240 px par unité sur chaque axe. Largeur d'un rectangle : 0,25 = 60 px. -->
  <!-- Hauteurs : x² en 0,25 ; 0,5 ; 0,75 ; 1 = 0,0625 ; 0,25 ; 0,5625 ; 1, soit 15 ; 60 ; 135 ; 240 px. -->
  <!-- Parabole y = x² de (0 ; 0) à (1 ; 1) : Bézier quadratique exacte, point de contrôle (0,5 ; 0). -->
  <g fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-width="1.2"><rect x="40" y="265" width="60" height="15"/><rect x="100" y="220" width="60" height="60"/><rect x="160" y="145" width="60" height="135"/><rect x="220" y="40" width="60" height="240"/></g>
  <g fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="1.2"><rect x="100" y="265" width="60" height="15"/><rect x="160" y="220" width="60" height="60"/><rect x="220" y="145" width="60" height="135"/></g>
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="25" y1="280" x2="305" y2="280"/><polyline points="299,276 305,280 299,284"/><line x1="40" y1="295" x2="40" y2="15"/><polyline points="36,21 40,15 44,21"/></g>
  <g stroke="#334155" stroke-width="1"><line x1="100" y1="277" x2="100" y2="283"/><line x1="160" y1="277" x2="160" y2="283"/><line x1="220" y1="277" x2="220" y2="283"/><line x1="280" y1="277" x2="280" y2="283"/><line x1="37" y1="220" x2="43" y2="220"/><line x1="37" y1="160" x2="43" y2="160"/><line x1="37" y1="100" x2="43" y2="100"/><line x1="37" y1="40" x2="43" y2="40"/></g>
  <text x="100" y="296" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">0,25</text>
  <text x="160" y="296" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">0,5</text>
  <text x="220" y="296" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">0,75</text>
  <text x="280" y="296" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">1</text>
  <text x="34" y="296" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">O</text>
  <text x="34" y="224" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">0,25</text>
  <text x="34" y="164" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">0,5</text>
  <text x="34" y="104" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">0,75</text>
  <text x="34" y="44" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">1</text>
  <text x="302" y="272" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end" font-style="italic">x</text>
  <text x="48" y="23" font-family="Georgia,serif" font-size="12" fill="#475569" font-style="italic">y</text>
  <path d="M 40 280 Q 160 280 280 40" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
  <text x="150" y="80" font-family="Georgia,serif" font-size="12" fill="#2563eb">y = x²</text>
</svg>
