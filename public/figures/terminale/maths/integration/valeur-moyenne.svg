<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300" role="img" aria-label="Dans un repère orthonormé, la parabole d'équation y = 4 − x² descend du point (0 ; 4) au point (2 ; 0) ; le domaine sous la courbe, entre x = 0 et x = 2, est colorié. Un rectangle en pointillés orange, de base [0 ; 2] et de hauteur μ = 8/3, a la même aire que ce domaine, 16/3. La droite y = 8/3 coupe la parabole. À gauche, la partie du domaine qui dépasse au-dessus de cette droite est en bleu foncé ; à droite, la partie du rectangle qui est au-dessus de la courbe est en orange. Ces deux parties ont la même aire : l'une comble l'autre.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Repère : origine (60, 270) ; 60 px par unité sur chaque axe. -->
  <!-- Parabole y = 4 − x² de (0 ; 4) à (2 ; 0) : Bézier quadratique exacte, point de contrôle (1 ; 4) ; paramètre t = x / 2. -->
  <!-- μ = (16/3) / 2 = 8/3, soit y = 110 px. La droite y = 8/3 coupe la parabole en x = 2/√3 ≈ 1,1547 (129,282 px), t = 1/√3. -->
  <!-- Découpe de la Bézier en t = 1/√3 : à gauche, contrôle (1/√3 ; 4) ; à droite, contrôle (1 + 1/√3 ; 4 − 4/√3). -->
  <!-- Aire bleu foncé = aire orange = 16 / (9√3) ≈ 1,03 u.a. -->
  <path d="M 60 270 L 60 30 Q 120 30 180 270 Z" fill="#2563eb" fill-opacity="0.18"/>
  <path d="M 60 110 L 60 30 Q 94.641 30 129.282 110 Z" fill="#2563eb" fill-opacity="0.5"/>
  <path d="M 129.282 110 Q 154.641 168.564 180 270 L 180 110 Z" fill="#ea580c" fill-opacity="0.4"/>
  <rect x="60" y="110" width="120" height="160" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5 3"/>
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="45" y1="270" x2="225" y2="270"/><polyline points="219,266 225,270 219,274"/><line x1="60" y1="285" x2="60" y2="12"/><polyline points="56,18 60,12 64,18"/></g>
  <g stroke="#334155" stroke-width="1"><line x1="120" y1="267" x2="120" y2="273"/><line x1="180" y1="267" x2="180" y2="273"/><line x1="57" y1="210" x2="63" y2="210"/><line x1="57" y1="150" x2="63" y2="150"/><line x1="57" y1="110" x2="63" y2="110"/><line x1="57" y1="30" x2="63" y2="30"/></g>
  <text x="120" y="286" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">1</text>
  <text x="180" y="286" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">2</text>
  <text x="54" y="286" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">O</text>
  <text x="54" y="214" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">1</text>
  <text x="54" y="154" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">2</text>
  <text x="54" y="114" font-family="Georgia,serif" font-size="11" fill="#ea580c" text-anchor="end">μ = 8/3</text>
  <text x="54" y="34" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">4</text>
  <text x="222" y="262" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end" font-style="italic">x</text>
  <text x="68" y="20" font-family="Georgia,serif" font-size="12" fill="#475569" font-style="italic">y</text>
  <path d="M 60 30 Q 120 30 180 270" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <text x="150" y="62" font-family="Georgia,serif" font-size="12" fill="#0f172a">y = 4 − x²</text>
  <text x="117" y="246" font-family="Georgia,serif" font-size="11" fill="#0f172a" text-anchor="middle">même aire : 16/3</text>
</svg>
