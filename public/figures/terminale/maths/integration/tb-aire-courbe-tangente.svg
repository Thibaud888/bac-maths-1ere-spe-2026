<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" role="img" aria-label="Dans un repère orthogonal quadrillé (un carreau mesure 0,5 sur 0,5), pour x allant de 0 à 3 : la courbe Cf, en bleu, part de l'origine en montant très vite, atteint un maximum d'environ 2,6 vers x = 0,37, redescend jusqu'à un minimum d'environ 1,65 vers x = 1,65 en passant par le point A(1 ; 2), puis remonte en passant par le point B(e ; e) et finit vers 3,35 en x = 3. La tangente TA, en vert, passe par A et par le point C(3 ; 0) de l'axe des abscisses. La tangente TB, en orange, touche la courbe en B ; elle coupe la droite d'équation x = 1 sous l'axe des abscisses, vers y = −0,72. Le domaine compris entre la courbe Cf, au-dessus, et la tangente TB, au-dessous, pour x allant de 1 à e, est hachuré.">
