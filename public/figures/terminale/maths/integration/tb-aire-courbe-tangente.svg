  <!-- Repère orthogonal : origine (40 ; 290), 110 px par unité en abscisse, 70 px par unité en ordonnée. f(x) = x[2(ln x)² − 3 ln x + 2] tracée sur ]0 ; 3] (polyligne de 0,002 à 3) ; maximum local 7/e ≈ 2,58 en 1/e, minimum local √e ≈ 1,65 en √e, point d'inflexion en e^(−1/4) ≈ 0,78 ; TA : y = 3 − x ; TB : y = 2x − e ; domaine hachuré entre TB et Cf pour 1 ≤ x ≤ e. -->
