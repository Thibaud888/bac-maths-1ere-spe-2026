<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="340" height="240" role="img" aria-label="Dans un repère d'origine O, avec la même unité sur les deux axes, la courbe Cf d'une fonction f continue et positive : elle ondule au-dessus de l'axe des abscisses. Entre les droites verticales en pointillés d'abscisses a et b, le domaine D, colorié en bleu, est limité par la courbe en haut et par l'axe des abscisses en bas. Près de l'origine, un carré en pointillés de côté 1 représente l'unité d'aire, notée 1 u.a.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Repère : origine (40, 200) ; 40 px par unité sur chaque axe. a en x = 110 px, b en x = 280 px. -->
  <!-- Courbe : trois arcs de Bézier cubiques raccordés en a et en b (tangentes alignées) ; le domaine reprend l'arc du milieu. -->
  <path d="M 110 200 L 110 120 C 155 65, 220 165, 280 95 L 280 200 Z" fill="#2563eb" fill-opacity="0.18"/>
  <rect x="40" y="160" width="40" height="40" fill="#94a3b8" fill-opacity="0.25" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2"/>
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="20" y1="200" x2="325" y2="200"/><polyline points="319,196 325,200 319,204"/><line x1="40" y1="225" x2="40" y2="12"/><polyline points="36,18 40,12 44,18"/></g>
  <g stroke="#334155" stroke-width="1"><line x1="80" y1="197" x2="80" y2="203"/><line x1="37" y1="160" x2="43" y2="160"/></g>
  <g stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3"><line x1="110" y1="200" x2="110" y2="120"/><line x1="280" y1="200" x2="280" y2="95"/></g>
  <path d="M 50 150 C 70 145, 87.5 147.5, 110 120 C 155 65, 220 165, 280 95 C 298 74, 308 67, 315 64" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
  <text x="80" y="215" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">1</text>
  <text x="34" y="164" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">1</text>
  <text x="34" y="215" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">O</text>
  <text x="60" y="184" font-family="Georgia,serif" font-size="9" fill="#475569" text-anchor="middle">1 u.a.</text>
  <text x="110" y="216" font-family="Georgia,serif" font-size="13" fill="#334155" text-anchor="middle" font-style="italic">a</text>
  <text x="280" y="216" font-family="Georgia,serif" font-size="13" fill="#334155" text-anchor="middle" font-style="italic">b</text>
  <text x="322" y="192" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end" font-style="italic">x</text>
  <text x="48" y="20" font-family="Georgia,serif" font-size="12" fill="#475569" font-style="italic">y</text>
  <text x="192" y="168" font-family="Georgia,serif" font-size="15" fill="#1e40af" text-anchor="middle" font-style="italic">D</text>
  <text x="286" y="62" font-family="Georgia,serif" font-size="13" fill="#2563eb" font-style="italic">C<tspan font-size="9" dy="3">f</tspan></text>
</svg>
