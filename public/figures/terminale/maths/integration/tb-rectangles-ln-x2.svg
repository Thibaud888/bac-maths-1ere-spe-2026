<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290" width="460" height="290" role="img" aria-label="Dans un repère, pour x allant de 0 à 11 et y de 0 à 0,25 : la courbe Cf, en bleu, coupe l'axe des abscisses en x = 1, monte jusqu'à un maximum d'environ 0,18 vers x = 1,65, puis redescend lentement vers l'axe des abscisses sans l'atteindre. Neuf rectangles coloriés, de largeur 1, sont posés sur l'axe des abscisses entre x = 1 et x = 10. Le premier, sur [1 ; 2], a pour hauteur le maximum de f, environ 0,18 : il touche la courbe en son sommet. Chacun des huit autres, sur [2 ; 3], [3 ; 4], …, [9 ; 10], a pour hauteur la valeur de f au bord gauche de l'intervalle : son coin supérieur gauche est sur la courbe, et la courbe passe sous son bord supérieur. Les rectangles recouvrent tout le domaine situé sous la courbe entre x = 1 et x = 10.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Repère orthogonal : origine (40 ; 250), 34 px par unité en abscisse, 900 px par unité en ordonnée. f(x) = ln(x)/x² tracée de 0,99 à 11,5 ; maximum 1/(2e) ≈ 0,184 en √e ≈ 1,65. Rectangles : [1 ; 2] de hauteur 1/(2e), puis [i ; i + 1] de hauteur f(i) pour i de 2 à 9. -->
