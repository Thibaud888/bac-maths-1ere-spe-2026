<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 270" width="290" height="270" role="img" aria-label="Dans un repère orthonormé, la droite d'équation y = x pour x entre −1,4 et 2,3. Sur [0 ; 2], la droite est au-dessus de l'axe des abscisses : le triangle de sommets (0 ; 0), (2 ; 0) et (2 ; 2), en bleu, a pour aire 2. Sur [−1 ; 0], la droite est en dessous de l'axe : le triangle de sommets (−1 ; 0), (0 ; 0) et (−1 ; −1), en orange, a pour aire 1/2. L'intégrale de −1 à 2 de x dx vaut 2 − 1/2 = 3/2.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Repère : origine (110, 170) ; 60 px par unité sur chaque axe. -->
  <!-- Droite y = x de (−1,4 ; −1,4) à (2,3 ; 2,3). Triangles : bleu (0;0) (2;0) (2;2) ; orange (−1;0) (0;0) (−1;−1). -->
  <polygon points="110,170 230,170 230,50" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.2"/>
  <polygon points="50,170 110,170 50,230" fill="#ea580c" fill-opacity="0.35" stroke="#ea580c" stroke-width="1.2"/>
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="15" y1="170" x2="275" y2="170"/><polyline points="269,166 275,170 269,174"/><line x1="110" y1="255" x2="110" y2="15"/><polyline points="106,21 110,15 114,21"/></g>
  <g stroke="#334155" stroke-width="1"><line x1="50" y1="167" x2="50" y2="173"/><line x1="170" y1="167" x2="170" y2="173"/><line x1="230" y1="167" x2="230" y2="173"/><line x1="107" y1="110" x2="113" y2="110"/><line x1="107" y1="50" x2="113" y2="50"/><line x1="107" y1="230" x2="113" y2="230"/></g>
  <text x="50" y="162" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">−1</text>
  <text x="170" y="186" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">1</text>
  <text x="230" y="186" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">2</text>
  <text x="115" y="184" font-family="Georgia,serif" font-size="11" fill="#475569">O</text>
  <text x="104" y="114" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">1</text>
  <text x="104" y="54" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">2</text>
  <text x="104" y="234" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">−1</text>
  <text x="272" y="162" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end" font-style="italic">x</text>
  <text x="118" y="23" font-family="Georgia,serif" font-size="12" fill="#475569" font-style="italic">y</text>
  <line x1="26" y1="254" x2="248" y2="32" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <text x="250" y="48" font-family="Georgia,serif" font-size="12" fill="#0f172a">y = x</text>
  <text x="196" y="144" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">aire 2</text>
  <text x="68" y="196" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#9a3412" text-anchor="middle">1/2</text>
</svg>
