<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 330" width="320" height="330" role="img" aria-label="Dans un repère orthonormé, la droite d'équation y = x, en orange, et la parabole d'équation y = x², en bleu, partent toutes deux de l'origine et se recoupent au point de coordonnées (1 ; 1). Pour x entre 0 et 1, la droite est au-dessus de la parabole ; le domaine compris entre elles est colorié en bleu clair et marqué A. Une droite verticale en pointillés marque l'abscisse 1. Au-delà de x = 1, la parabole passe au-dessus de la droite.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Repère : origine (40, 300) ; 200 px par unité sur chaque axe. -->
  <!-- Parabole y = x² de (0 ; 0) à (1,2 ; 1,44) : Bézier quadratique exacte, contrôle (0,6 ; 0). Bord du domaine sur [0 ; 1] : contrôle (0,5 ; 0). -->
  <path d="M 40 300 L 240 100 Q 140 300 40 300 Z" fill="#2563eb" fill-opacity="0.2"/>
  <line x1="240" y1="300" x2="240" y2="100" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3"/>
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="25" y1="300" x2="305" y2="300"/><polyline points="299,296 305,300 299,304"/><line x1="40" y1="315" x2="40" y2="8"/><polyline points="36,14 40,8 44,14"/></g>
  <g stroke="#334155" stroke-width="1"><line x1="140" y1="297" x2="140" y2="303"/><line x1="240" y1="297" x2="240" y2="303"/><line x1="37" y1="200" x2="43" y2="200"/><line x1="37" y1="100" x2="43" y2="100"/></g>
  <text x="140" y="316" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">0,5</text>
  <text x="240" y="316" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">1</text>
  <text x="34" y="316" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">O</text>
  <text x="34" y="204" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">0,5</text>
  <text x="34" y="104" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">1</text>
  <text x="302" y="292" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end" font-style="italic">x</text>
  <text x="48" y="16" font-family="Georgia,serif" font-size="12" fill="#475569" font-style="italic">y</text>
  <line x1="40" y1="300" x2="280" y2="60" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
  <path d="M 40 300 Q 160 300 280 12" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
  <text x="150" y="170" font-family="Georgia,serif" font-size="12" fill="#ea580c" text-anchor="end">y = x</text>
  <text x="252" y="200" font-family="Georgia,serif" font-size="12" fill="#2563eb">y = x²</text>
  <text x="150" y="216" font-family="Georgia,serif" font-size="14" fill="#1e40af" text-anchor="middle" font-style="italic">A</text>
</svg>
