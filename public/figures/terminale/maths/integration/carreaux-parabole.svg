<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300" role="img" aria-label="Dans un repère orthonormé, sur un quadrillage de carreaux de 0,5 sur 0,5, la parabole d'équation y = 4 − x² descend du point (0 ; 4) au point (2 ; 0). Colonne par colonne, de gauche à droite, les carreaux entièrement sous la parabole sont coloriés en bleu : 7, puis 6, puis 3, puis 0. Les carreaux traversés par la courbe sont coloriés en orange : 1, puis 2, puis 3, puis 4.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Repère : origine (40, 270) ; 60 px par unité sur chaque axe ; un carreau = 0,5 × 0,5 = 30 px × 30 px. -->
  <!-- Parabole y = 4 − x² de (0 ; 4) à (2 ; 0) : Bézier quadratique exacte, point de contrôle (1 ; 4), intersection des tangentes y = 4 et y = −4x + 8. -->
  <!-- Colonne [x ; x + 0,5] : carreaux entiers = partie entière de f(x + 0,5) / 0,5 ; carreaux atteints = arrondi supérieur de f(x) / 0,5 (f décroissante). -->
  <g fill="#2563eb" fill-opacity="0.35"><rect x="40" y="60" width="30" height="210"/><rect x="70" y="90" width="30" height="180"/><rect x="100" y="180" width="30" height="90"/></g>
  <g fill="#ea580c" fill-opacity="0.3"><rect x="40" y="30" width="30" height="30"/><rect x="70" y="30" width="30" height="60"/><rect x="100" y="90" width="30" height="90"/><rect x="130" y="150" width="30" height="120"/></g>
  <g stroke="#94a3b8" stroke-width="0.8"><line x1="70" y1="30" x2="70" y2="270"/><line x1="100" y1="30" x2="100" y2="270"/><line x1="130" y1="30" x2="130" y2="270"/><line x1="160" y1="30" x2="160" y2="270"/><line x1="40" y1="30" x2="160" y2="30"/><line x1="40" y1="60" x2="160" y2="60"/><line x1="40" y1="90" x2="160" y2="90"/><line x1="40" y1="120" x2="160" y2="120"/><line x1="40" y1="150" x2="160" y2="150"/><line x1="40" y1="180" x2="160" y2="180"/><line x1="40" y1="210" x2="160" y2="210"/><line x1="40" y1="240" x2="160" y2="240"/></g>
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="25" y1="270" x2="205" y2="270"/><polyline points="199,266 205,270 199,274"/><line x1="40" y1="285" x2="40" y2="12"/><polyline points="36,18 40,12 44,18"/></g>
  <text x="70" y="286" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">0,5</text>
  <text x="100" y="286" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">1</text>
  <text x="130" y="286" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">1,5</text>
  <text x="160" y="286" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">2</text>
  <text x="34" y="286" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">O</text>
  <text x="34" y="214" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">1</text>
  <text x="34" y="154" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">2</text>
  <text x="34" y="94" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">3</text>
  <text x="34" y="34" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">4</text>
  <text x="202" y="262" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end" font-style="italic">x</text>
  <text x="48" y="20" font-family="Georgia,serif" font-size="12" fill="#475569" font-style="italic">y</text>
  <path d="M 40 30 Q 100 30 160 270" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <text x="166" y="205" font-family="Georgia,serif" font-size="12" fill="#0f172a" text-anchor="start">y = 4 − x²</text>
</svg>
