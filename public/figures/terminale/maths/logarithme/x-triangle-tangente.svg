<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 400" width="370" height="400" role="img" aria-label="Dans un repère orthonormé, la courbe de la fonction ln, en vert, et sa tangente au point M d'abscisse a = 0,5, en orange. La tangente coupe l'axe des abscisses au point P, d'abscisse environ 0,85, et l'axe des ordonnées au point Q, d'ordonnée environ −1,69. Le triangle OPQ, coloré, est sous l'axe des abscisses.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Origine (50, 160) ; 100 px par unité sur les deux axes. ln sur [0,1 ; 3] ; tangente au point d'abscisse a = 0,5 : y = 2x + ln 0,5 − 1. -->
  <polygon points="50,160 134.7,160 50,329.3" fill="#fde68a" fill-opacity="0.7" stroke="#b45309" stroke-width="1"/>
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="15" y1="160" x2="360" y2="160"/><polyline points="354,156 360,160 354,164"/><line x1="50" y1="395" x2="50" y2="15"/><polyline points="46,21 50,15 54,21"/></g>
  <g stroke="#334155" stroke-width="1"><line x1="150" y1="157" x2="150" y2="163"/><line x1="250" y1="157" x2="250" y2="163"/><line x1="350" y1="157" x2="350" y2="163"/><line x1="47" y1="60" x2="53" y2="60"/><line x1="47" y1="260" x2="53" y2="260"/><line x1="47" y1="360" x2="53" y2="360"/></g>
  <text x="150" y="176" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">1</text>
  <text x="250" y="176" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">2</text>
  <text x="350" y="176" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">3</text>
  <text x="44" y="64" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">1</text>
  <text x="44" y="264" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">−1</text>
  <text x="44" y="364" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">−2</text>
  <line x1="100" y1="160" x2="100" y2="229.3" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="100" y="152" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="middle" font-style="italic">a</text>
  <line x1="35" y1="359.3" x2="185" y2="59.3" stroke="#b45309" stroke-width="2"/>
  <path d="M60,390.3 L62,372 L65,349.7 L70,320.9 L75,298.6 L80,280.4 L90,251.6 L100,229.3 L110,211.1 L130,182.3 L150,160 L170,141.8 L200,119.5 L230,101.2 L260,85.8 L290,72.5 L320,60.7 L350,50.1" stroke="#047857" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100" cy="229.3" r="3.5" fill="#047857"/>
  <circle cx="134.7" cy="160" r="3" fill="#b45309"/>
  <circle cx="50" cy="329.3" r="3" fill="#b45309"/>
  <text x="42" y="176" font-family="Georgia,serif" font-size="13" fill="#334155" text-anchor="end">O</text>
  <text x="138" y="152" font-family="Georgia,serif" font-size="13" fill="#b45309" text-anchor="start">P</text>
  <text x="42" y="334" font-family="Georgia,serif" font-size="13" fill="#b45309" text-anchor="end">Q</text>
  <text x="108" y="240" font-family="Georgia,serif" font-size="13" fill="#047857" text-anchor="start">M</text>
  <text x="190" y="62" font-family="Georgia,serif" font-size="13" fill="#b45309" text-anchor="start" font-style="italic">Tₐ</text>
  <text x="350" y="40" font-family="Georgia,serif" font-size="12" fill="#047857" text-anchor="end" font-style="italic">y = ln x</text>
</svg>
