<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 330" width="330" height="330" role="img" aria-label="Dans un repère orthonormé, la courbe de l'exponentielle en bleu et celle du logarithme népérien en vert, symétriques l'une de l'autre par rapport à la droite d'équation y = x, tracée en pointillés gris. La courbe de l'exponentielle passe par les points (0 ; 1) et (1 ; e) ; celle de ln passe par leurs symétriques (1 ; 0) et (e ; 1). Près de 0, la courbe de ln descend le long de l'axe des ordonnées, son asymptote verticale ; la courbe de l'exponentielle longe l'axe des abscisses vers la gauche.">
