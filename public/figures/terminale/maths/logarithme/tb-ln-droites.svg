<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 300" width="430" height="300" role="img" aria-label="Dans un repère orthogonal quadrillé, pour x allant de 0 à 16 et y de −1 à 8 : la courbe d'équation y = ln x, qui monte lentement depuis le bas du cadre près de l'axe des ordonnées, passe par le point (1 ; 0) et atteint environ 2,8 en x = 16 ; la droite d'équation y = x, qui part de l'origine et sort du cadre par le haut en x = 8, en restant toujours au-dessus de la courbe ; la droite d'équation y = 0,2x, qui part de l'origine et atteint 3,2 en x = 16. Cette dernière droite coupe la courbe en deux points, d'abscisses environ 1,3 et 12,7.">
