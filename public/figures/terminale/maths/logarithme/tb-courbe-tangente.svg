<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" width="360" height="318" role="img" aria-label="Courbe Cf de la fonction f et sa tangente T au point A d'abscisse 1, dans un repère orthonormé quadrillé, pour x allant de −2 à 7 et y de −2 à 6. La courbe entre dans le cadre par le haut vers x = −0,9, descend en passant par l'origine jusqu'à un minimum d'environ −0,5 vers x = 0,3, remonte en passant par A, de coordonnées environ (1 ; 0,5), jusqu'à un maximum d'environ 2,5 vers x = 3, puis redescend et coupe l'axe des abscisses un peu après x = 6. La tangente T est une droite de coefficient directeur 2 qui touche la courbe au point A ; elle coupe l'axe des ordonnées vers y = −1,5.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- 36 px par unité sur chaque axe : repère orthonormé. f(x) = 5 ln(x² + 1) − 3x ; f = 6 en x ≈ −0,94 ; minimum local 5 ln(10/9) − 1 ≈ −0,47 en 1/3 ; maximum local 5 ln 10 − 9 ≈ 2,51 en 3 ; A(1 ; 5 ln 2 − 3 ≈ 0,47) ; tangente T : y = 2x + 5 ln 2 − 5. -->
