  <line x1="50" y1="262" x2="50" y2="102" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="210" y1="262" x2="210" y2="102" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
