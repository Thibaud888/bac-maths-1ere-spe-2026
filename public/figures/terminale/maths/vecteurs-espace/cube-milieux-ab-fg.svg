<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-label="Le cube ABCDEFGH en perspective : la face du dessous est ABCD, la face du dessus EFGH, avec E au-dessus de A, F au-dessus de B, G au-dessus de C et H au-dessus de D ; les trois arêtes qui partent de D, cachées, sont en pointillé. Deux points sont marqués en bleu : I au milieu de l'arête [AB], en bas de la face avant, et J au milieu de l'arête [FG], en haut de la face de droite.">
  <!-- Cube ABCDEFGH (mêmes coordonnées que cube.svg) ; I milieu de [AB], J milieu de [FG]. -->
