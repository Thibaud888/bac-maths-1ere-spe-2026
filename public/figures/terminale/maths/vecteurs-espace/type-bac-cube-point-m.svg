<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Le cube ABCDEFGH en perspective, avec E, F, G, H au-dessus de A, B, C, D ; les arêtes qui partent de D, cachées, sont en pointillé. L'arête [AB] est prolongée au-delà de B jusqu'au point M, marqué en bleu, de sorte que BM = AB.">
