<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-label="Le cube ABCDEFGH en perspective, avec E au-dessus de A, F au-dessus de B, G au-dessus de C et H au-dessus de D. Le rectangle ACGE, coloré en bleu, coupe le cube en diagonale : ses côtés sont les arêtes verticales [AE] et [CG], la diagonale [AC] de la face du dessous, cachée et en pointillé, et la diagonale [EG] de la face du dessus. Ses diagonales [AG] et [CE], cachées, sont en pointillé ; elles se coupent au centre du cube, marqué d'un point.">
  <!-- Cube ABCDEFGH ; rectangle ACGE (AE = CG) ; [AC], [AG], [CE] cachées en pointillé ; centre du cube au croisement des diagonales. -->
