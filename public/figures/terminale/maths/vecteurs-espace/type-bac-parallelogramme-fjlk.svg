<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 45 340 245" width="340" height="245" role="img" aria-label="Le cube ABCDEFGH en perspective, avec E, F, G, H au-dessus de A, B, C, D ; les arêtes qui partent de D, cachées, sont en pointillé. Le point J est sur l'arête [CG], aux deux tiers de sa hauteur en partant de C. Le point I est le centre de la face de gauche ADHE. La droite (d), en orange, passe par I ; elle coupe l'arête [AE] en K, aux deux tiers de sa hauteur, et l'arête [DH] en L, au tiers de sa hauteur. Le quadrilatère FJLK est coloré en bleu ; ses côtés [JL] et [LK], cachés, sont en pointillé.">
