<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" role="img" aria-label="En haut, trois dessins d'un même plan P, représenté par un parallélogramme. À gauche, la droite d est tracée dans le plan : elle est contenue dans P. Au milieu, la droite d est au-dessus du plan, parallèle à son ombre en pointillé dans le plan : elle est strictement parallèle à P ; deux traits verticaux en pointillé relient d à son ombre. À droite, la droite d traverse le plan au point I ; sa partie cachée sous le plan est en pointillé : d et P sont sécants en I. En bas à gauche, deux plans P et P′ superposés : ils sont strictement parallèles. En bas à droite, un plan horizontal P et un plan vertical P′ qui le traverse : ils se coupent selon une droite Δ, en orange.">
