<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-label="Le cube ABCDEFGH en perspective, avec E, F, G, H au-dessus de A, B, C, D ; les arêtes qui partent de D, cachées, sont en pointillé. Le triangle ABG est coloré en bleu : son côté [AB] est une arête du cube, son côté [BG] une diagonale de la face de droite BCGF, et son côté [AG], une grande diagonale du cube, passe à l'intérieur du cube, en pointillé. Le point I est le milieu de [AB] et le point J le milieu de [BG].">
