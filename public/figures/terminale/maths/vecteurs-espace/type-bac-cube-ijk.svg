<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-label="Un cube ABCDEFGH dessiné en perspective : la face du dessous est ABCD, la face du dessus EFGH, avec E au-dessus de A, F au-dessus de B, G au-dessus de C et H au-dessus de D ; les trois arêtes qui partent de D, cachées, sont en pointillé. Trois points sont marqués en bleu : I au milieu de l'arête [EF], J au milieu de l'arête [BC] et K au milieu de l'arête [AE].">
  <!-- Cube ABCDEFGH ; I milieu de [EF], J milieu de [BC], K milieu de [AE]. -->
