<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-label="Le cube ABCDEFGH en perspective : la face du dessous est ABCD, la face du dessus EFGH, avec E au-dessus de A, F au-dessus de B, G au-dessus de C et H au-dessus de D ; les trois arêtes qui partent de D, cachées, sont en pointillé. Le triangle BDE est coloré en bleu : son côté [BE] est une diagonale de la face avant, ses côtés [BD] et [DE], cachés, sont en pointillé. Le triangle CFH est coloré en orange : ses côtés [CF] et [FH] sont des diagonales de la face de droite et de la face du dessus, son côté [CH], caché, est en pointillé. La grande diagonale [AG], qui traverse le cube, est tracée en gris pointillé ; les points P et Q, aux tiers de [AG] en partant de A, y sont marqués.">
  <!-- Cube ABCDEFGH (mêmes coordonnées que cube.svg) ; triangle BDE en bleu, triangle CFH en orange ; [AG] en gris pointillé ; P et Q tels que AP = AG/3 et AQ = 2AG/3. -->
