<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-label="Un cube ABCDEFGH dessiné en perspective. La face avant ABFE est un carré vu de face ; la face du dessous est ABCD, celle du dessus EFGH, avec E au-dessus de A, F au-dessus de B, G au-dessus de C et H au-dessus de D. Les trois arêtes qui partent de D, cachées, sont en pointillé. Les quatre arêtes verticales sont des flèches bleues orientées vers le haut : elles représentent le même vecteur AE.">
