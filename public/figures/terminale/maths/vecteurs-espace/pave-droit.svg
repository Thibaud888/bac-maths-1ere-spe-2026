<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 290" width="340" height="290" role="img" aria-label="Un pavé droit ABCDEFGH dessiné en perspective. La face du dessous est ABCD, avec A devant à gauche, B devant à droite, C derrière à droite et D derrière à gauche ; la face du dessus est EFGH, avec E au-dessus de A, F au-dessus de B, G au-dessus de C et H au-dessus de D. Les trois arêtes qui partent de D, cachées, sont en pointillé. Les longueurs sont indiquées : AB = 4, BC = 2 et AE = 3.">
  <!-- Pavé droit ABCDEFGH : AB = 4, AD = 2, AE = 3 (50 px par unité, profondeur en perspective cavalière comme cube.svg) ; arêtes cachées [AD], [DC], [DH] en pointillé. -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <line x1="50" y1="250" x2="250" y2="250" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="250" y1="250" x2="292.1" y2="214.6" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="292.1" y1="214.6" x2="92.1" y2="214.6" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="92.1" y1="214.6" x2="50" y2="250" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="50" y1="100" x2="250" y2="100" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="250" y1="100" x2="292.1" y2="64.6" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="292.1" y1="64.6" x2="92.1" y2="64.6" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="92.1" y1="64.6" x2="50" y2="100" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="250" x2="50" y2="100" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="250" y1="250" x2="250" y2="100" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="292.1" y1="214.6" x2="292.1" y2="64.6" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="92.1" y1="214.6" x2="92.1" y2="64.6" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
