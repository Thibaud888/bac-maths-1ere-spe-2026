<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" role="img" aria-label="Un tétraèdre ABCD dessiné en perspective : A en haut, B à gauche, C devant à droite, D à l'arrière ; les trois arêtes qui partent de D, cachées, sont en pointillé. Le point P est sur la droite (BD), prolongée au-delà de B par un trait gris : B est entre P et D, et P est deux fois plus loin de B que D. Le point Q est devant C : le segment [CQ], en orange, est parallèle à l'arête [BD], elle aussi en orange, et de même longueur.">
  <!-- Tétraèdre ABCD ; P = 3B − 2D (BP = −2 BD) ; Q = C + B − D (CQ = −BD). -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <line x1="60" y1="280" x2="170" y2="230" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="230" y1="40" x2="170" y2="230" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="230" x2="350" y2="250" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="350" y1="250" x2="230" y2="40" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="230" y1="40" x2="225" y2="205" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="350" y1="250" x2="225" y2="205" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="170" y1="230" x2="225" y2="205" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="350" y1="250" x2="295" y2="275" stroke="#b45309" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="60" cy="280" r="3.5" fill="#334155"/>
  <circle cx="295" cy="275" r="3.5" fill="#334155"/>
  <text x="230" y="30" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">A</text>
  <text x="164" y="250" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">B</text>
  <text x="364" y="256" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">C</text>
  <text x="236" y="198" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">D</text>
  <text x="58" y="302" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">P</text>
  <text x="291" y="297" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">Q</text>
</svg>
