<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 215" width="545" height="215" role="img" aria-label="Un plan P dessiné en perspective comme un parallélogramme, quadrillé par des parallèles à deux directions. Du point A partent le vecteur u, flèche bleue, et le vecteur v, flèche orange, qui ne sont pas colinéaires. Le point M est atteint en avançant de deux fois u, puis d'une fois v : la flèche noire de A à M représente AM = 2u + v.">
