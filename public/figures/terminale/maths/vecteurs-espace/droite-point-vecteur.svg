<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 215" width="570" height="215" role="img" aria-label="Une droite d. Sur elle, le point A et le vecteur u, flèche bleue qui part de A le long de la droite. Le point M1, tel que AM1 = 2u, est deux longueurs de u plus loin dans le sens de u (marqué t = 2) ; le point M2, tel que AM2 = −u, est une longueur de u en arrière (marqué t = −1). Le point N est hors de la droite : le vecteur AN, en gris, n'est pas un multiple de u.">
  <!-- Droite d, point A, vecteur directeur u ; M1 = A + 2u, M2 = A − u ; N hors de d. -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <line x1="25" y1="175" x2="545" y2="50" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="155" y1="143.8" x2="236.7" y2="124.1" stroke="#2563eb" stroke-width="3.2" stroke-linecap="butt"/><polygon points="247.4,121.5 237.7,128.5 235.6,119.7" fill="#2563eb"/>
  <line x1="155" y1="143.8" x2="294.8" y2="201.5" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="butt"/><polygon points="305,205.8 293.1,205.7 296.6,197.4" fill="#94a3b8"/>
  <circle cx="155" cy="143.8" r="3.5" fill="#334155"/>
  <circle cx="339.7" cy="99.3" r="3.5" fill="#334155"/>
  <circle cx="62.6" cy="166" r="3.5" fill="#334155"/>
  <circle cx="305" cy="205.8" r="3.5" fill="#475569"/>
  <text x="154.3" y="165.4" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">A</text>
  <text x="343.5" y="120.9" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">M<tspan font-size="10" dy="3">1</tspan></text>
  <text x="343.5" y="138.9" font-family="Georgia,serif" font-size="13" fill="#2563eb" text-anchor="middle">t = 2</text>
  <text x="66.4" y="187.5" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">M<tspan font-size="10" dy="3">2</tspan></text>
  <text x="66.4" y="205.5" font-family="Georgia,serif" font-size="13" fill="#2563eb" text-anchor="middle">t = −1</text>
  <text x="319" y="210.8" font-family="Georgia,serif" font-size="15" fill="#475569" text-anchor="start" font-style="italic">N</text>
  <text x="197.4" y="117.1" font-family="Georgia,serif" font-size="15" fill="#2563eb" text-anchor="middle" font-style="italic">u</text><line x1="192.4" y1="104.3" x2="201.4" y2="104.3" stroke="#2563eb" stroke-width="1.2" stroke-linecap="butt"/><polygon points="204.4,104.3 200.4,101.7 200.4,106.9" fill="#2563eb"/>
  <text x="533" y="38" font-family="Georgia,serif" font-size="16" fill="#334155" text-anchor="middle" font-style="italic">d</text>
</svg>
