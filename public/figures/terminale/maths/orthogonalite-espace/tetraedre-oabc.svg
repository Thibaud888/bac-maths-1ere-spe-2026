<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290" width="380" height="290" role="img" aria-label="Le tétraèdre OABC dans un repère orthonormé : O est l'origine, A(2 ; 0 ; 0) est sur l'axe qui vient vers l'avant à gauche, B(0 ; 4 ; 0) sur l'axe horizontal vers la droite, C(0 ; 0 ; 4) sur l'axe vertical. Les trois arêtes [OA], [OB], [OC] sont perpendiculaires deux à deux, avec des angles droits marqués en O. L'arête [OC] est en orange : c'est la hauteur pour la base OAB. La face ABC est colorée en bleu.">
  <!-- Tétraèdre OABC : O(0;0;0), A(2;0;0), B(0;4;0), C(0;0;4). Écran : O + x(-22;17) + y(50;0) + z(0;-45). Fond transparent. -->
  <polygon points="96,254 340,220 140,40" fill="#2563eb" fill-opacity="0.10"/>
  <line x1="140" y1="220" x2="96" y2="254" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="220" x2="340" y2="220" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="254" x2="340" y2="220" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="254" x2="140" y2="40" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="340" y1="220" x2="140" y2="40" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="220" x2="140" y2="40" stroke="#b45309" stroke-width="2.8" stroke-linecap="round"/>
  <polyline points="140,210 150,210 150,220" fill="none" stroke="#334155" stroke-width="1.3"/>
  <polyline points="140,210 132.1,216.1 132.1,226.1" fill="none" stroke="#334155" stroke-width="1.3"/>
  <polyline points="148,220 140.1,226.1 132.1,226.1" fill="none" stroke="#334155" stroke-width="1.3"/>
  <circle cx="140" cy="220" r="3" fill="#334155"/>
  <text x="152" y="238" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">O</text>
  <text x="80" y="270" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle"><tspan font-style="italic">A</tspan>(2 ; 0 ; 0)</text>
  <text x="330" y="245" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle"><tspan font-style="italic">B</tspan>(0 ; 4 ; 0)</text>
  <text x="140" y="28" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle"><tspan font-style="italic">C</tspan>(0 ; 0 ; 4)</text>
</svg>
