<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" role="img" aria-label="Un plan P dessiné en perspective comme un parallélogramme bleu. Le point M est au-dessus du plan. Le segment orange [MH] descend tout droit de M jusqu'au point H du plan, avec un angle droit marqué en H. Un autre point N du plan est relié à H par un segment du plan et à M par un segment : le triangle MHN est rectangle en H, et MN est plus long que MH.">
  <!-- Projeté orthogonal H de M sur le plan P ; N, autre point de P : triangle MHN rectangle en H. Fond transparent. -->
  <polygon points="40,205 250,205 320,140 110,140" fill="#2563eb" fill-opacity="0.10" stroke="#334155" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="62" y="196" font-family="Georgia,serif" font-size="16" fill="#334155" text-anchor="middle" font-style="italic">P</text>
  <line x1="170" y1="175" x2="255" y2="190" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="40" x2="255" y2="190" stroke="#334155" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="170" y1="40" x2="170" y2="175" stroke="#b45309" stroke-width="2.6" stroke-linecap="round"/>
  <polyline points="170,164 179.8,165.7 179.8,176.7" fill="none" stroke="#b45309" stroke-width="1.4"/>
  <circle cx="170" cy="40" r="3.5" fill="#334155"/>
  <circle cx="170" cy="175" r="3.5" fill="#b45309"/>
  <circle cx="255" cy="190" r="3.5" fill="#334155"/>
  <text x="156" y="38" font-family="Georgia,serif" font-size="16" fill="#334155" text-anchor="middle" font-style="italic">M</text>
  <text x="156" y="190" font-family="Georgia,serif" font-size="16" fill="#b45309" text-anchor="middle" font-style="italic">H</text>
  <text x="268" y="200" font-family="Georgia,serif" font-size="16" fill="#334155" text-anchor="middle" font-style="italic">N</text>
</svg>
