<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 55 310 215" width="310" height="215" role="img" aria-label="Le triangle ABC dans un repère orthonormé d'origine O : A est sur l'axe qui vient vers l'avant à gauche, B sur l'axe horizontal vers la droite, C sur l'axe vertical. La face ABC est colorée en bleu ; les segments [OA], [OB] et [OC], cachés derrière elle, sont en pointillé. Le point K est sur le côté [AB], le segment [CK] est tracé en bleu, et le point H est placé sur [CK], plus près de C que de K. Le segment [OH], caché, est en pointillé orange.">
  <!-- Exercice tb-orthogonalite-espace-004. O(0;0;0), A(2V3;0;0), B(0;2;0), C(0;0;1), K(V3/2;3/2;0), H(V3/8;3/8;3/4), avec V3 la racine carrée de 3. -->
  <!-- Écran : O + x(-26;20) + y(80;0) + z(0;-80). Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <polygon points="59.9,239.3 310,170 150,90" fill="#2563eb" fill-opacity="0.10"/>
  <line x1="150" y1="170" x2="59.9" y2="239.3" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="150" y1="170" x2="310" y2="170" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="150" y1="170" x2="150" y2="90" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="150" y1="170" x2="174.4" y2="114.3" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 3"/>
  <line x1="59.9" y1="239.3" x2="310" y2="170" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="310" y1="170" x2="150" y2="90" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="90" x2="59.9" y2="239.3" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="90" x2="247.5" y2="187.3" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <circle cx="150" cy="170" r="3" fill="#334155"/>
  <circle cx="247.5" cy="187.3" r="3.5" fill="#2563eb"/>
  <circle cx="174.4" cy="114.3" r="3.5" fill="#2563eb"/>
  <text x="138" y="166" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">O</text>
  <text x="48" y="256" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">A</text>
  <text x="323" y="176" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">B</text>
  <text x="150" y="78" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">C</text>
  <text x="252" y="207" font-family="Georgia,serif" font-size="15" fill="#2563eb" text-anchor="middle" font-style="italic">K</text>
  <text x="160" y="126" font-family="Georgia,serif" font-size="15" fill="#2563eb" text-anchor="middle" font-style="italic">H</text>
</svg>
