<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 70 380 190" width="380" height="190" role="img" aria-label="Le tétraèdre OABC dans un repère orthonormé : O est l'origine, A(2 ; 0 ; 0) est sur l'axe qui vient vers l'avant à gauche, B(0 ; 3 ; 0) sur l'axe horizontal vers la droite, C(0 ; 0 ; 1) sur l'axe vertical. La face ABC est colorée en bleu ; les arêtes [OA], [OB] et [OC], cachées derrière cette face, sont en pointillé. Le point H est marqué sur la face ABC, et le segment [OH], caché lui aussi, est en pointillé orange.">
  <!-- Exercice tb-orthogonalite-espace-001. O(0;0;0), A(2;0;0), B(0;3;0), C(0;0;1), H(18/49;12/49;36/49). -->
  <!-- Écran : O + x(-30;23) + y(75;0) + z(0;-75). Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <polygon points="70,226 355,180 130,105" fill="#2563eb" fill-opacity="0.10"/>
  <line x1="130" y1="180" x2="70" y2="226" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="130" y1="180" x2="355" y2="180" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="130" y1="180" x2="130" y2="105" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="130" y1="180" x2="137.3" y2="133.3" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 3"/>
  <line x1="70" y1="226" x2="355" y2="180" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="355" y1="180" x2="130" y2="105" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="105" x2="70" y2="226" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle cx="130" cy="180" r="3" fill="#334155"/>
  <circle cx="137.3" cy="133.3" r="3.5" fill="#2563eb"/>
  <text x="143" y="198" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle" font-style="italic">O</text>
  <text x="151" y="137" font-family="Georgia,serif" font-size="15" fill="#2563eb" text-anchor="middle" font-style="italic">H</text>
  <text x="62" y="246" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle"><tspan font-style="italic">A</tspan>(2 ; 0 ; 0)</text>
  <text x="345" y="202" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle"><tspan font-style="italic">B</tspan>(0 ; 3 ; 0)</text>
  <text x="130" y="94" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle"><tspan font-style="italic">C</tspan>(0 ; 0 ; 1)</text>
</svg>
