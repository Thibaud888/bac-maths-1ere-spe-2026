<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 305" width="440" height="305" role="img" aria-label="Le cube ABCDEFGH en perspective : la face du dessous est ABCD, avec A devant à gauche, B devant à droite, C derrière à droite et D derrière à gauche ; la face du dessus est EFGH, avec E au-dessus de A, F au-dessus de B, G au-dessus de C et H au-dessus de D. Les trois arêtes qui partent de D, cachées, sont en pointillé. Trois flèches bleues partent de A : vers B, vers D (en pointillé, car cachée) et vers E. À côté de chaque sommet sont écrites ses coordonnées : A(0 ; 0 ; 0), B(1 ; 0 ; 0), C(1 ; 1 ; 0), D(0 ; 1 ; 0), E(0 ; 0 ; 1), F(1 ; 0 ; 1), G(1 ; 1 ; 1) et H(0 ; 1 ; 1).">
  <!-- Cube ABCDEFGH : mêmes sommets que cube-produit-scalaire.svg, décalés de (+80 ; +8) pour laisser la place aux coordonnées. -->
  <!-- Repère (A ; AB, AD, AE) : flèches bleues, [AD] cachée en pointillé. Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <line x1="130" y1="270" x2="290" y2="270" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="290" y1="270" x2="357.4" y2="213.4" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="357.4" y1="213.4" x2="197.4" y2="213.4" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="197.4" y1="213.4" x2="130" y2="270" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="130" y1="110" x2="290" y2="110" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="290" y1="110" x2="357.4" y2="53.4" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="357.4" y1="53.4" x2="197.4" y2="53.4" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="197.4" y1="53.4" x2="130" y2="110" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="270" x2="130" y2="110" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="290" y1="270" x2="290" y2="110" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="357.4" y1="213.4" x2="357.4" y2="53.4" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="197.4" y1="213.4" x2="197.4" y2="53.4" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <!-- Vecteurs du repère : AB, AD (caché), AE. -->
  <line x1="130" y1="270" x2="279" y2="270" stroke="#2563eb" stroke-width="2.6" stroke-linecap="butt"/><polygon points="290,270 279,274.5 279,265.5" fill="#2563eb"/>
  <line x1="130" y1="270" x2="189" y2="220.5" stroke="#2563eb" stroke-width="2.2" stroke-linecap="butt" stroke-dasharray="5 4"/><polygon points="197.4,213.4 191.9,223.9 186.1,217" fill="#2563eb"/>
  <line x1="130" y1="270" x2="130" y2="121" stroke="#2563eb" stroke-width="2.6" stroke-linecap="butt"/><polygon points="130,110 134.5,121 125.5,121" fill="#2563eb"/>
  <!-- Sommets et coordonnées. -->
  <text x="130" y="292" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle"><tspan font-style="italic">A</tspan><tspan font-size="13">(0 ; 0 ; 0)</tspan></text>
  <text x="290" y="292" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="middle"><tspan font-style="italic">B</tspan><tspan font-size="13">(1 ; 0 ; 0)</tspan></text>
  <text x="366" y="226" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="start"><tspan font-style="italic">C</tspan><tspan font-size="13">(1 ; 1 ; 0)</tspan></text>
  <text x="205" y="231" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="start"><tspan font-style="italic">D</tspan><tspan font-size="13">(0 ; 1 ; 0)</tspan></text>
  <text x="120" y="114" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="end"><tspan font-style="italic">E</tspan><tspan font-size="13">(0 ; 0 ; 1)</tspan></text>
  <text x="282" y="128" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="end"><tspan font-style="italic">F</tspan><tspan font-size="13">(1 ; 0 ; 1)</tspan></text>
  <text x="366" y="47" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="start"><tspan font-style="italic">G</tspan><tspan font-size="13">(1 ; 1 ; 1)</tspan></text>
  <text x="189" y="47" font-family="Georgia,serif" font-size="15" fill="#334155" text-anchor="end"><tspan font-style="italic">H</tspan><tspan font-size="13">(0 ; 1 ; 1)</tspan></text>
</svg>
