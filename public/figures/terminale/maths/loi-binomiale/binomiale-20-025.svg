<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-label="Diagramme en bâtons de la loi binomiale de paramètres 20 et 0,25, pour k de 0 à 20. Les bâtons montent jusqu'à k = 5 (environ 0,20), puis redescendent ; au-delà de k = 12, ils sont trop petits pour être vus. Les bâtons de 0 à 5, en bleu, totalisent P(X ≤ 5) ≈ 0,617 ; ceux de 6 à 20, en orange, totalisent P(X ≥ 6) ≈ 0,383.">
  <!-- Origine du repère en (40, 220) ; bâton k centré en x = 52 + 14k ; une unité de probabilité = 800 px. -->
  <!-- Hauteurs : 800 × P(X = k), P(X = k) = C(20, k) × 3^(20 − k) / 4^20. -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
