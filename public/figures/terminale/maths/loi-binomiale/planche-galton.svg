<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" role="img" aria-label="Planche de Galton à 4 rangées de clous (1, 2, 3 puis 4 clous). Le trajet d'une bille est dessiné : à droite, à gauche, à droite, à droite ; elle tombe dans la case 3. Sous les clous, 5 cases numérotées de 0 à 4 ; des barres de hauteurs proportionnelles à 1, 4, 6, 4 et 1 montrent la répartition de beaucoup de billes.">
  <!-- Rangées de clous tous les 40 px (y = 55, 95, 135, 175) ; deux clous voisins à 40 px. -->
  <!-- Cases centrées en x = 100, 140, 180, 220, 260 ; barres : 14 px par unité (1, 4, 6, 4, 1). -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="158" y1="8" x2="174" y2="24"/>
    <line x1="202" y1="8" x2="186" y2="24"/>
  </g>
  <g fill="#bfdbfe" stroke="#2563eb" stroke-width="1">
    <rect x="86" y="286" width="28" height="14"/>
    <rect x="126" y="244" width="28" height="56"/>
    <rect x="166" y="216" width="28" height="84"/>
    <rect x="206" y="244" width="28" height="56"/>
    <rect x="246" y="286" width="28" height="14"/>
  </g>
  <g stroke="#334155" stroke-width="1.5">
    <line x1="80" y1="196" x2="80" y2="300"/>
    <line x1="120" y1="196" x2="120" y2="300"/>
    <line x1="160" y1="196" x2="160" y2="300"/>
    <line x1="200" y1="196" x2="200" y2="300"/>
    <line x1="240" y1="196" x2="240" y2="300"/>
    <line x1="280" y1="196" x2="280" y2="300"/>
    <line x1="80" y1="300" x2="280" y2="300"/>
  </g>
  <g fill="#334155">
    <circle cx="180" cy="55" r="4"/>
    <circle cx="160" cy="95" r="4"/>
    <circle cx="200" cy="95" r="4"/>
    <circle cx="140" cy="135" r="4"/>
    <circle cx="180" cy="135" r="4"/>
    <circle cx="220" cy="135" r="4"/>
    <circle cx="120" cy="175" r="4"/>
    <circle cx="160" cy="175" r="4"/>
    <circle cx="200" cy="175" r="4"/>
    <circle cx="240" cy="175" r="4"/>
  </g>
  <polyline points="180,20 180,46 200,86 180,126 200,166 220,206 220,232" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="220" cy="238" r="5" fill="#b45309"/>
  <g font-family="Georgia,serif" font-size="12" fill="#b45309" font-weight="bold">
    <text x="196" y="66">D</text>
    <text x="172" y="106">G</text>
    <text x="196" y="146">D</text>
    <text x="216" y="186">D</text>
  </g>
  <g font-family="Georgia,serif" font-size="12" fill="#475569">
    <text x="12" y="30">D : la bille part à droite</text>
    <text x="12" y="46">G : la bille part à gauche</text>
  </g>
  <g font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="middle">
    <text x="100" y="318">0</text>
    <text x="140" y="318">1</text>
    <text x="180" y="318">2</text>
    <text x="220" y="318">3</text>
    <text x="260" y="318">4</text>
  </g>
  <text x="72" y="318" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end">case</text>
</svg>
