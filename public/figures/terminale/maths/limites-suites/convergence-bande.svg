<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" width="360" height="310" role="img" aria-label="Termes u_n de la suite 2 + 1,6 × (−0,5)^n pour n de 0 à 12 : ils oscillent autour de la droite d'ordonnée ℓ = 2 en s'en rapprochant ; à partir du rang N = 3, tous les points sont dans la bande horizontale comprise entre 1,7 et 2,3.">
