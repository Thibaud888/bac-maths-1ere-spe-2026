<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 300" width="370" height="300" role="img" aria-label="Courbe d'une fonction continue f sur l'intervalle de a à b. Elle part du point d'ordonnée f(a), en bas à gauche, monte, redescend, puis remonte jusqu'au point d'ordonnée f(b), en haut à droite. La droite horizontale d'équation y = k, avec k compris entre f(a) et f(b), coupe la courbe en trois points, d'abscisses c1, c2 et c3 : l'équation f(x) = k a ici trois solutions, et il y en a toujours au moins une. Une bande orange, sur l'axe des ordonnées, va de f(a) à f(b) : elle marque les valeurs de k possibles.">
  <!-- Origine en (190, 200) ; une unité = 70 px en abscisse, 50 px en ordonnée. -->
  <!-- Courbe : f(x) = x³ − 3x + 1 sur [−2 ; 2], a = −2, b = 2, f(a) = −1, f(b) = 3, k = 1 ; solutions −√3, 0, √3. -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="20" y1="200" x2="362" y2="200"/><polyline points="356,196 362,200 356,204"/><line x1="190" y1="292" x2="190" y2="12"/><polyline points="186,18 190,12 194,18"/></g>
  <g stroke="#334155" stroke-width="1"><line x1="50" y1="197" x2="50" y2="203"/><line x1="120" y1="197" x2="120" y2="203"/><line x1="260" y1="197" x2="260" y2="203"/><line x1="330" y1="197" x2="330" y2="203"/><line x1="187" y1="250" x2="193" y2="250"/><line x1="187" y1="150" x2="193" y2="150"/><line x1="187" y1="100" x2="193" y2="100"/><line x1="187" y1="50" x2="193" y2="50"/></g>
  <!-- Bande orange : les valeurs comprises entre f(a) et f(b), c'est-à-dire les valeurs de k possibles (expliquée dans la légende). -->
  <line x1="190" y1="250" x2="190" y2="50" stroke="#b45309" stroke-width="5" stroke-opacity="0.35"/>
  <g stroke="#475569" stroke-width="1" stroke-dasharray="4 3"><line x1="50" y1="200" x2="50" y2="250"/><line x1="50" y1="250" x2="190" y2="250"/><line x1="330" y1="200" x2="330" y2="50"/><line x1="330" y1="50" x2="190" y2="50"/><line x1="68.8" y1="150" x2="68.8" y2="200"/><line x1="311.2" y1="150" x2="311.2" y2="200"/></g>
  <line x1="30" y1="150" x2="350" y2="150" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="352" y="144" font-family="Georgia,serif" font-size="12" fill="#b45309" text-anchor="end" font-style="italic">y = k</text>
  <polyline points="50,250 53.5,228.2 57,207.9 60.5,189.1 64,171.6 67.5,155.5 71,140.6 74.5,127.1 78,114.8 81.5,103.7 85,93.8 88.5,84.9 92,77.2 95.5,70.5 99,64.8 102.5,60.2 106,56.4 109.5,53.5 113,51.6 116.5,50.4 120,50 123.5,50.4 127,51.4 130.5,53.2 134,55.6 137.5,58.6 141,62.2 144.5,66.2 148,70.8 151.5,75.8 155,81.2 158.5,87.1 162,93.2 165.5,99.6 169,106.4 172.5,113.3 176,120.4 179.5,127.7 183,135.1 186.5,142.5 190,150 193.5,157.5 197,165 200.5,172.3 204,179.6 207.5,186.7 211,193.7 214.5,200.4 218,206.8 221.5,212.9 225,218.8 228.5,224.2 232,229.2 235.5,233.8 239,237.9 242.5,241.4 246,244.4 249.5,246.8 253,248.6 256.5,249.6 260,250 263.5,249.6 267,248.4 270.5,246.5 274,243.6 277.5,239.8 281,235.1 284.5,229.5 288,222.8 291.5,215.1 295,206.2 298.5,196.3 302,185.2 305.5,172.9 309,159.3 312.5,144.5 316,128.4 319.5,110.9 323,92 326.5,71.8 330,50" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="303.4" y="77.5" font-family="Georgia,serif" font-size="13" fill="#2563eb" text-anchor="end" font-style="italic">C<tspan font-size="10" dy="3">f</tspan></text>
  <circle cx="50" cy="250" r="3.5" fill="#2563eb"/>
  <circle cx="330" cy="50" r="3.5" fill="#2563eb"/>
  <circle cx="68.8" cy="150" r="4" fill="#b45309"/>
  <circle cx="190" cy="150" r="4" fill="#b45309"/>
  <circle cx="311.2" cy="150" r="4" fill="#b45309"/>
  <text x="50" y="192" font-family="Georgia,serif" font-size="13" fill="#475569" text-anchor="middle" font-style="italic">a</text>
  <text x="330" y="216" font-family="Georgia,serif" font-size="13" fill="#475569" text-anchor="middle" font-style="italic">b</text>
  <text x="70.8" y="216" font-family="Georgia,serif" font-size="13" fill="#b45309" text-anchor="middle" font-style="italic">c<tspan font-size="10" dy="3">1</tspan></text>
  <text x="202" y="216" font-family="Georgia,serif" font-size="13" fill="#b45309" text-anchor="middle" font-style="italic">c<tspan font-size="10" dy="3">2</tspan></text>
  <text x="309.2" y="216" font-family="Georgia,serif" font-size="13" fill="#b45309" text-anchor="middle" font-style="italic">c<tspan font-size="10" dy="3">3</tspan></text>
  <text x="198" y="254" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="start" font-style="italic">f(a)</text>
  <text x="182" y="54" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end" font-style="italic">f(b)</text>
  <text x="182" y="144" font-family="Georgia,serif" font-size="12" fill="#b45309" text-anchor="end" font-style="italic">k</text>
  <text x="356" y="216" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="middle" font-style="italic">x</text>
  <text x="178" y="22" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="middle" font-style="italic">y</text>
  <text x="183" y="215" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end">O</text>
</svg>
