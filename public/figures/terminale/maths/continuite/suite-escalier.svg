  <circle cx="40" cy="310" r="4" fill="#2563eb"/>
  <circle cx="280" cy="70" r="4" fill="#2563eb"/>
  <line x1="280" y1="70" x2="280" y2="310" stroke="#2563eb" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="298" y="328" font-family="Georgia,serif" font-size="13" fill="#2563eb" text-anchor="middle"><tspan font-style="italic">ℓ</tspan> = 1</text>
</svg>
