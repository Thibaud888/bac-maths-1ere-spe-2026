<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 340" width="370" height="340" role="img" aria-label="Courbe de f(x) = 2x/(x + 1) et droite d'équation y = x, qui se coupent à l'origine et au point de coordonnées (1 ; 1). Un escalier part de u0 = 0,5 sur l'axe des abscisses : il monte jusqu'à la courbe, puis rejoint horizontalement la droite y = x, ce qui reporte u1 sur l'axe, et ainsi de suite. Les termes u0, u1, u2, u3 avancent vers la droite et s'accumulent vers 1, abscisse du point d'intersection : la limite ℓ vérifie f(ℓ) = ℓ.">
  <!-- Origine en (40, 310) ; une unité = 240 px sur les deux axes. -->
  <!-- f(x) = 2x/(x + 1), u0 = 0,5 ; u1 = 2/3, u2 = 0,8, u3 = 8/9, u4 = 16/17… ; points fixes 0 et 1. -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="30" y1="310" x2="352" y2="310"/><polyline points="346,306 352,310 346,314"/><line x1="40" y1="320" x2="40" y2="14"/><polyline points="36,20 40,14 44,20"/></g>
  <g stroke="#334155" stroke-width="1"><line x1="160" y1="307" x2="160" y2="313"/><line x1="37" y1="190" x2="43" y2="190"/><line x1="280" y1="307" x2="280" y2="313"/><line x1="37" y1="70" x2="43" y2="70"/></g>
  <text x="32" y="74" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end">1</text>
  <text x="32" y="194" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end">0,5</text>
  <text x="33" y="325" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end">O</text>
  <text x="348" y="326" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="middle" font-style="italic">x</text>
  <text x="28" y="24" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="middle" font-style="italic">y</text>
  <line x1="40" y1="310" x2="328" y2="22" stroke="#334155" stroke-width="1.5"/>
  <text x="324" y="16" font-family="Georgia,serif" font-size="12" fill="#334155" text-anchor="end" font-style="italic">y = x</text>
