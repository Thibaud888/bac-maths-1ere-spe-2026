  <circle cx="160" cy="310" r="3" fill="#b45309"/>
  <text x="160" y="328" font-family="Georgia,serif" font-size="13" fill="#b45309" text-anchor="middle" font-style="italic">u<tspan font-size="10" dy="3">0</tspan></text>
  <circle cx="200" cy="310" r="3" fill="#b45309"/>
  <text x="200" y="328" font-family="Georgia,serif" font-size="13" fill="#b45309" text-anchor="middle" font-style="italic">u<tspan font-size="10" dy="3">1</tspan></text>
