  <text x="22" y="38" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="middle" font-style="italic">y</text>
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="284" y1="196" x2="508" y2="196"/><polyline points="502,192 508,196 502,200"/><line x1="294" y1="206" x2="294" y2="30"/><polyline points="290,36 294,30 298,36"/></g>
  <text x="394" y="20" font-family="Georgia,serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="bold">g n'est pas continue en a</text>
