<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="520" height="230" role="img" aria-label="Deux repères côte à côte. À gauche, la courbe d'une fonction f se trace d'un seul trait ; elle passe par le point d'abscisse a et d'ordonnée f(a) : f est continue en a. À droite, la courbe d'une fonction g est coupée en deux morceaux en a : le morceau de gauche s'arrête au point plein d'ordonnée g(a), le morceau de droite repart plus haut, à partir d'un point creux. Ce saut fait que g n'est pas continue en a.">
  <!-- Deux panneaux, une unité = 50 px ; origines en (34, 196) et (294, 196). -->
  <!-- Gauche : f(x) = 0,6 + 1,1x − 0,18x², a = 2. Droite : g(x) = 0,5 + 0,5x si x ≤ 2, g(x) = 2,6 + 0,3(x − 2) si x > 2. -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="24" y1="196" x2="248" y2="196"/><polyline points="242,192 248,196 242,200"/><line x1="34" y1="206" x2="34" y2="30"/><polyline points="30,36 34,30 38,36"/></g>
