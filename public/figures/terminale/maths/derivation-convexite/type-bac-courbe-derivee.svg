<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 406 287.6" width="406" height="288" role="img" aria-label="Courbe de la dérivée f′ dans un repère quadrillé, pour x allant de −7 à environ 2,7. Vers x = −7, elle est très proche de l'axe des abscisses, juste au-dessus. Elle monte lentement jusqu'à un maximum d'environ 1,8, atteint vers x = −1, puis redescend : elle passe par le point (0 ; 1), coupe l'axe des abscisses vers x = 0,4, descend jusqu'à un minimum d'environ −7,4, atteint vers x = 2, puis remonte très vite, recoupe l'axe des abscisses vers x = 2,6 et sort du cadre par le haut.">
