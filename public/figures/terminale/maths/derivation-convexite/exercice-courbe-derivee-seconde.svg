<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" role="img" aria-label="Courbe de la dérivée seconde f″ sur l'intervalle de −2 à 3,5. Elle part du point (−2 ; −4), monte et traverse l'axe des abscisses en −1, atteint un sommet au point (0 ; 1), redescend jusqu'à toucher l'axe des abscisses au point (2 ; 0) sans le traverser, puis remonte jusqu'à environ 2,5 en 3,5. Elle est en dessous de l'axe entre −2 et −1, au-dessus ensuite, sauf en 2 où elle le touche.">
