<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 290" width="395" height="290" role="img" aria-label="Trois courbes tracées sur l'intervalle de −0,6 à 4. La courbe C1, en vert et en tirets, part du point (−0,6 ; −2,9) environ, monte en traversant l'axe des abscisses en 1, atteint un sommet très bas vers (2 ; 0,14), puis redescend lentement vers l'axe. La courbe C2, en bleu et en trait plein, part d'environ (−0,6 ; 0,73), atteint son maximum au point (0 ; 1), puis décroît vers l'axe des abscisses en restant au-dessus. La courbe C3, en orange et en pointillés, part d'environ (−0,6 ; 1,1), décroît en traversant l'axe des abscisses en 0, atteint son minimum vers (1 ; −0,37), puis remonte lentement vers l'axe en restant en dessous.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Origine (78, 96) ; 70 px par unité en x, 56 px en y. Fenêtre [−0,6 ; 4]. C1 : f''(x) = (x − 1)e^(−x) ; C2 : f(x) = (x + 1)e^(−x) ; C3 : f'(x) = −x e^(−x). -->
