<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" role="img" aria-label="Courbe de la dérivée f′ sur l'intervalle de −2 à 4. C'est une parabole tournée vers le bas : elle part du point (−2 ; −5), coupe l'axe des abscisses en −1, monte jusqu'à son sommet (1 ; 4), redescend, recoupe l'axe en 3 et finit au point (4 ; −5). Elle est au-dessus de l'axe entre −1 et 3, en dessous ailleurs ; elle est croissante de −2 à 1, décroissante de 1 à 4.">
