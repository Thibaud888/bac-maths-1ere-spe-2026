<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Courbe Cf, profil du toboggan, dans un repère quadrillé, pour x allant de −3 à 4. Elle part presque de l'axe des abscisses au point d'abscisse −3, monte de plus en plus vite jusque vers x = −0,2, puis de moins en moins vite et devient presque horizontale autour du point d'abscisse 1, d'ordonnée environ 1,4. Elle remonte ensuite de plus en plus vite et finit au point d'abscisse 4, d'ordonnée environ 3,2.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- 46 px par unité en x, 58 px en y ; quadrillage tous les 1 en x, tous les 0,5 en y. f(x) = e^x / (1 + x²) sur [−3 ; 4] : f(−3) ≈ 0,005, f(1) = e/2 ≈ 1,36 (tangente horizontale), f(4) = e⁴/17 ≈ 3,21 ; points d'inflexion vers x ≈ −0,18 et en x = 1. -->
