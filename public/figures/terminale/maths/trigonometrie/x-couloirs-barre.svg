<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 385" width="345" height="385" role="img" aria-label="Vue de dessus de deux couloirs qui se rejoignent à angle droit. Le premier couloir, horizontal, a pour largeur 3√3 m ; à son extrémité droite part vers le haut le second couloir, de largeur 1 m. Un segment vert touche le coin intérieur, là où se rejoignent les murs intérieurs des deux couloirs ; une extrémité est sur le mur extérieur du premier couloir, en bas, l'autre sur le mur extérieur du second couloir, à droite. L'angle x, marqué à l'extrémité du bas, est l'angle aigu entre le segment et ce mur du premier couloir.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Échelle 38 px pour 1 m ; coin intérieur C (270 ; 172,55), car 3√3 × 38 = 197,45. Angle tracé : 50° (pas π/3, réponse de la question 3). Extrémité du bas : 270 − 38 × 3√3 / tan 50° = 104,32 ; extrémité de droite : 370 − 38 × (3√3 + tan 50°) = 127,26. -->
  <polygon points="20,370 308,370 308,28 270,28 270,172.55 20,172.55" fill="#94a3b8" fill-opacity="0.15"/>
  <g stroke="#334155" stroke-width="2.5" fill="none" stroke-linejoin="miter"><polyline points="20,370 308,370 308,28"/><polyline points="20,172.55 270,172.55 270,28"/></g>
  <line x1="104.32" y1="370" x2="308" y2="127.26" stroke="#047857" stroke-width="4" stroke-linecap="round"/>
  <path d="M 134.32 370 A 30 30 0 0 0 123.6 347.02" stroke="#334155" stroke-width="1.2" fill="none"/>
  <g fill="#334155"><circle cx="104.32" cy="370" r="4"/><circle cx="308" cy="127.26" r="4"/><circle cx="270" cy="172.55" r="4"/></g>
  <g stroke="#475569" stroke-width="1.2" fill="none"><line x1="42" y1="366" x2="42" y2="176.55"/><polyline points="38,364 42,370 46,364"/><polyline points="38,178.55 42,172.55 46,178.55"/><line x1="274" y1="42" x2="304" y2="42"/><polyline points="276,38 270,42 276,46"/><polyline points="302,38 308,42 302,46"/></g>
  <g font-family="Georgia,serif" font-size="12" fill="#475569">
    <text x="141" y="357" text-anchor="start" font-style="italic">x</text>
    <text x="48" y="275" text-anchor="start">3√3 m</text>
    <text x="314" y="46" text-anchor="start">1 m</text>
    <text x="150" y="215" text-anchor="middle">premier couloir</text>
    <text x="262" y="164" text-anchor="end">coin intérieur</text>
  </g>
  <text transform="translate(294 95) rotate(-90)" x="0" y="0" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">second couloir</text>
</svg>
