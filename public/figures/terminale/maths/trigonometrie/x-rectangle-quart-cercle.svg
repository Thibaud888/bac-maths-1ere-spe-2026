<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 285" width="300" height="285" role="img" aria-label="Dans un repère d'origine O, le quart de cercle de centre O et de rayon 1, entre le point (1 ; 0) de l'axe des abscisses et le point (0 ; 1) de l'axe des ordonnées. Le point M est sur ce quart de cercle ; l'angle entre l'axe des abscisses et le rayon [OM], tracé en pointillés, mesure x. H est le pied de M sur l'axe des abscisses, K son pied sur l'axe des ordonnées. Le rectangle OHMK est colorié.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Axes sans nom : la lettre x ne désigne que l'angle. O (50, 250) ; rayon 200 px (1 unité). Angle x = 35° (pas π/4, réponse de la question 2) : M = (50 + 200 cos 35° ; 250 − 200 sin 35°) = (213,83 ; 135,28). -->
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="30" y1="250" x2="282" y2="250"/><polyline points="276,246 282,250 276,254"/><line x1="50" y1="270" x2="50" y2="18"/><polyline points="46,24 50,18 54,24"/></g>
  <path d="M 250 250 A 200 200 0 0 0 50 50" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <polygon points="50,250 213.83,250 213.83,135.28 50,135.28" fill="#047857" fill-opacity="0.15" stroke="#047857" stroke-width="2" stroke-linejoin="round"/>
  <line x1="50" y1="250" x2="213.83" y2="135.28" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M 85 250 A 35 35 0 0 0 78.67 229.92" stroke="#334155" stroke-width="1.2" fill="none"/>
  <g fill="#334155"><circle cx="50" cy="250" r="3.5"/><circle cx="213.83" cy="250" r="3.5"/><circle cx="213.83" cy="135.28" r="3.5"/><circle cx="50" cy="135.28" r="3.5"/><circle cx="250" cy="250" r="2.5"/><circle cx="50" cy="50" r="2.5"/></g>
  <g font-family="Georgia,serif" font-size="13" fill="#334155">
    <text x="44" y="267" text-anchor="end">O</text>
    <text x="213.83" y="268" text-anchor="middle">H</text>
    <text x="220" y="129" text-anchor="start">M</text>
    <text x="43" y="140" text-anchor="end">K</text>
  </g>
  <g font-family="Georgia,serif" font-size="12" fill="#475569">
    <text x="97" y="240" text-anchor="start" font-style="italic">x</text>
    <text x="250" y="268" text-anchor="middle">1</text>
    <text x="43" y="55" text-anchor="end">1</text>
  </g>
</svg>
