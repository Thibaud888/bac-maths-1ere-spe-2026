<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230" role="img" aria-label="Demi-cercle de centre O et de rayon 1, au-dessus de l'axe des abscisses, de A(−1 ; 0) à B(1 ; 0). Les points C et D sont sur le demi-cercle, à la même hauteur, symétriques par rapport à l'axe des ordonnées ; l'angle entre [OB] et [OC] mesure x. Le trapèze ABCD est colorié : sa grande base [AB] mesure 2, sa petite base [DC] mesure 2cos(x), et sa hauteur, tracée en pointillés de C jusqu'à l'axe des abscisses, vaut sin(x).">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Axes sans nom : la lettre x ne désigne que l'angle. O (190, 190) ; rayon 140 px (1 unité). Angle x = 50° : C = (190 + 140 cos 50° ; 190 − 140 sin 50°) = (280 ; 82,75), D = (100 ; 82,75). -->
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="15" y1="190" x2="367" y2="190"/><polyline points="361,186 367,190 361,194"/><line x1="190" y1="214" x2="190" y2="22"/><polyline points="186,28 190,22 194,28"/></g>
  <path d="M 50 190 A 140 140 0 0 1 330 190" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <polygon points="50,190 330,190 280,82.75 100,82.75" fill="#047857" fill-opacity="0.15" stroke="#047857" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"><line x1="190" y1="190" x2="280" y2="82.75"/><line x1="280" y1="82.75" x2="280" y2="190"/></g>
  <path d="M 222 190 A 32 32 0 0 0 210.57 165.49" stroke="#334155" stroke-width="1.2" fill="none"/>
  <g fill="#334155"><circle cx="50" cy="190" r="3.5"/><circle cx="330" cy="190" r="3.5"/><circle cx="280" cy="82.75" r="3.5"/><circle cx="100" cy="82.75" r="3.5"/></g>
  <g font-family="Georgia,serif" font-size="13" fill="#334155">
    <text x="44" y="207" text-anchor="end">A</text>
    <text x="336" y="207" text-anchor="start">B</text>
    <text x="286" y="78" text-anchor="start">C</text>
    <text x="94" y="78" text-anchor="end">D</text>
    <text x="185" y="207" text-anchor="end">O</text>
  </g>
  <g font-family="Georgia,serif" font-size="12" fill="#475569">
    <text x="228" y="177" text-anchor="start" font-style="italic">x</text>
    <text x="227" y="131" text-anchor="end">1</text>
    <text x="275" y="146" text-anchor="end">sin(x)</text>
    <text x="235" y="207" text-anchor="middle">cos(x)</text>
  </g>
</svg>
