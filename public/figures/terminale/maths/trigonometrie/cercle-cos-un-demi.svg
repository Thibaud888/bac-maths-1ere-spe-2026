<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" width="420" height="310" role="img" aria-label="Cercle trigonométrique de centre O et de rayon 1. La droite verticale d'abscisse 1/2 coupe le cercle en deux points : M(π/3) en haut et M(−π/3) en bas, symétriques par rapport à l'axe des abscisses. L'arc situé à droite de cette droite, en trait plein vert, va de M(−π/3) à M(π/3) en passant par le point I(1 ; 0) : ce sont les points où cos(x) ≥ 1/2. L'arc situé à gauche, en tirets orange, va de M(π/3) au point M(π) = M(−π) de coordonnées (−1 ; 0), puis à M(−π/3) : ce sont les points où cos(x) ≤ 1/2.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Centre O (200, 155) ; rayon 110 px (1 unité). M(π/3) = (255 ; 59,74), M(−π/3) = (255 ; 250,26) : 55 = 110 × 1/2 et 95,26 = 110 × √3/2. -->
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="40" y1="155" x2="372" y2="155"/><polyline points="366,151 372,155 366,159"/><line x1="200" y1="295" x2="200" y2="14"/><polyline points="196,20 200,14 204,20"/></g>
  <circle cx="200" cy="155" r="110" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
  <path d="M 255 250.26 A 110 110 0 0 0 255 59.74" stroke="#047857" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 255 59.74 A 110 110 0 1 0 255 250.26" stroke="#b45309" stroke-width="4" stroke-dasharray="9 5" fill="none"/>
  <line x1="255" y1="25" x2="255" y2="285" stroke="#334155" stroke-width="1.3"/>
  <g stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"><line x1="200" y1="155" x2="255" y2="59.74"/><line x1="200" y1="155" x2="255" y2="250.26"/></g>
  <path d="M 225 155 A 25 25 0 0 0 212.5 133.35" stroke="#334155" stroke-width="1.2" fill="none"/>
  <g fill="#334155"><circle cx="255" cy="59.74" r="4"/><circle cx="255" cy="250.26" r="4"/><circle cx="90" cy="155" r="4"/><circle cx="310" cy="155" r="3"/></g>
  <g font-family="Georgia,serif" font-size="12" fill="#334155">
    <text x="262" y="52" text-anchor="start">M(π/3)</text>
    <text x="262" y="270" text-anchor="start">M(−π/3)</text>
    <text x="84" y="146" text-anchor="end">M(π) = M(−π)</text>
  </g>
  <g font-family="Georgia,serif" font-size="11" fill="#475569">
    <text x="229" y="143" text-anchor="start">π/3</text>
    <text x="194" y="170" text-anchor="end">O</text>
    <text x="259" y="170" text-anchor="start">1/2</text>
    <text x="314" y="170" text-anchor="start">I</text>
    <text x="366" y="147" text-anchor="end" font-style="italic">x</text>
    <text x="206" y="24" text-anchor="start" font-style="italic">y</text>
  </g>
  <text x="318" y="108" font-family="Georgia,serif" font-size="12" fill="#047857" text-anchor="start">cos(x) ≥ 1/2</text>
  <text x="110" y="70" font-family="Georgia,serif" font-size="12" fill="#b45309" text-anchor="end">cos(x) ≤ 1/2</text>
</svg>
