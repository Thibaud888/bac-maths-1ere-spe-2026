<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" role="img" aria-label="Courbes des fonctions sinus, en trait plein vert, et cosinus, en tirets orange, sur l'intervalle de −2π à 2π. Les deux courbes ondulent entre les droites y = −1 et y = 1 et se répètent tous les 2π. La courbe de sinus passe par l'origine, monte jusqu'à 1 en π/2 et descend jusqu'à −1 en −π/2 et en 3π/2. La courbe de cosinus vaut 1 en 0, −1 en −π et en π, et elle est symétrique par rapport à l'axe des ordonnées.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Origine (290, 100) ; 40 px par unité sur les deux axes (repère orthonormé). Courbes sur [−2π ; 2π], tracées quart de période par quart de période avec des arcs de Bézier cubiques : de (0 ; 0) à (π/2 ; 1), points de contrôle (0,5123 ; 0,5123) et (1,0023 ; 1). -->
  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"><line x1="30" y1="60" x2="552" y2="60"/><line x1="30" y1="140" x2="552" y2="140"/></g>
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="12" y1="100" x2="568" y2="100"/><polyline points="562,96 568,100 562,104"/><line x1="290" y1="190" x2="290" y2="12"/><polyline points="286,18 290,12 294,18"/></g>
  <g stroke="#334155" stroke-width="1"><line x1="38.67" y1="97" x2="38.67" y2="103"/><line x1="101.5" y1="97" x2="101.5" y2="103"/><line x1="164.34" y1="97" x2="164.34" y2="103"/><line x1="227.17" y1="97" x2="227.17" y2="103"/><line x1="352.83" y1="97" x2="352.83" y2="103"/><line x1="415.66" y1="97" x2="415.66" y2="103"/><line x1="478.5" y1="97" x2="478.5" y2="103"/><line x1="541.33" y1="97" x2="541.33" y2="103"/><line x1="287" y1="60" x2="293" y2="60"/><line x1="287" y1="140" x2="293" y2="140"/></g>
  <g font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">
    <text x="38.67" y="127">−2π</text>
    <text x="101.5" y="127">−3π/2</text>
    <text x="164.34" y="127">−π</text>
    <text x="227.17" y="127">−π/2</text>
    <text x="352.83" y="127">π/2</text>
    <text x="415.66" y="127">π</text>
    <text x="478.5" y="127">3π/2</text>
    <text x="541.33" y="127">2π</text>
  </g>
  <text x="284" y="55" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">1</text>
  <text x="284" y="153" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">−1</text>
  <text x="295" y="114" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="start">O</text>
  <text x="562" y="92" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end" font-style="italic">x</text>
  <text x="298" y="22" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="start" font-style="italic">y</text>
  <path d="M 38.67 100 c 20.49,-20.49 40.09,-40 62.83,-40 c 22.74,0 42.34,19.51 62.83,40 c 20.49,20.49 40.09,40 62.83,40 c 22.74,0 42.34,-19.51 62.83,-40 c 20.49,-20.49 40.09,-40 62.83,-40 c 22.74,0 42.34,19.51 62.83,40 c 20.49,20.49 40.09,40 62.83,40 c 22.74,0 42.34,-19.51 62.83,-40" stroke="#047857" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 38.67 60 c 22.74,0 42.34,19.51 62.83,40 c 20.49,20.49 40.09,40 62.83,40 c 22.74,0 42.34,-19.51 62.83,-40 c 20.49,-20.49 40.09,-40 62.83,-40 c 22.74,0 42.34,19.51 62.83,40 c 20.49,20.49 40.09,40 62.83,40 c 22.74,0 42.34,-19.51 62.83,-40 c 20.49,-20.49 40.09,-40 62.83,-40" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 4" fill="none" stroke-linejoin="round"/>
  <text x="352.83" y="48" font-family="Georgia,serif" font-size="12" fill="#047857" text-anchor="middle" font-style="italic">y = sin(x)</text>
  <text x="415.66" y="158" font-family="Georgia,serif" font-size="12" fill="#b45309" text-anchor="middle" font-style="italic">y = cos(x)</text>
</svg>
