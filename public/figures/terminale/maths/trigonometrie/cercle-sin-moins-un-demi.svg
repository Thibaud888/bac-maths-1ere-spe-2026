<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" width="420" height="310" role="img" aria-label="Cercle trigonométrique de centre O et de rayon 1. La droite horizontale d'ordonnée −1/2 coupe le cercle en deux points, tous deux dans la moitié basse : M(−π/6) à droite et M(−5π/6) à gauche, symétriques par rapport à l'axe des ordonnées. L'arc situé sous cette droite, en tirets orange, va de M(−5π/6) à M(−π/6) en passant par le point M(−π/2) de coordonnées (0 ; −1) : ce sont les points où sin(x) ≤ −1/2. L'arc situé au-dessus, en trait plein vert, passe par le point I(1 ; 0) et par le haut du cercle : ce sont les points où sin(x) ≥ −1/2.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Centre O (200, 155) ; rayon 110 px (1 unité). M(−π/6) = (295,26 ; 210), M(−5π/6) = (104,74 ; 210) : 95,26 = 110 × √3/2 et 55 = 110 × 1/2 (ordonnée −1/2, vers le bas). M(−π/2) = (200 ; 265). -->
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="40" y1="155" x2="372" y2="155"/><polyline points="366,151 372,155 366,159"/><line x1="200" y1="295" x2="200" y2="14"/><polyline points="196,20 200,14 204,20"/></g>
  <circle cx="200" cy="155" r="110" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
  <path d="M 295.26 210 A 110 110 0 1 0 104.74 210" stroke="#047857" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 104.74 210 A 110 110 0 0 0 295.26 210" stroke="#b45309" stroke-width="4" stroke-dasharray="9 5" fill="none"/>
  <line x1="50" y1="210" x2="350" y2="210" stroke="#334155" stroke-width="1.3"/>
  <g stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"><line x1="200" y1="155" x2="295.26" y2="210"/><line x1="200" y1="155" x2="104.74" y2="210"/></g>
  <path d="M 225 155 A 25 25 0 0 1 221.65 167.5" stroke="#334155" stroke-width="1.2" fill="none"/>
  <g fill="#334155"><circle cx="295.26" cy="210" r="4"/><circle cx="104.74" cy="210" r="4"/><circle cx="200" cy="265" r="3"/><circle cx="310" cy="155" r="3"/></g>
  <g font-family="Georgia,serif" font-size="12" fill="#334155">
    <text x="302" y="228" text-anchor="start">M(−π/6)</text>
    <text x="97" y="228" text-anchor="end">M(−5π/6)</text>
    <text x="206" y="282" text-anchor="start">M(−π/2)</text>
  </g>
  <g font-family="Georgia,serif" font-size="11" fill="#475569">
    <text x="231" y="168" text-anchor="start">−π/6</text>
    <text x="194" y="170" text-anchor="end">O</text>
    <text x="195" y="205" text-anchor="end">−1/2</text>
    <text x="314" y="170" text-anchor="start">I</text>
    <text x="366" y="147" text-anchor="end" font-style="italic">x</text>
    <text x="206" y="24" text-anchor="start" font-style="italic">y</text>
  </g>
  <text x="110" y="70" font-family="Georgia,serif" font-size="12" fill="#047857" text-anchor="end">sin(x) ≥ −1/2</text>
  <text x="150" y="290" font-family="Georgia,serif" font-size="12" fill="#b45309" text-anchor="end">sin(x) ≤ −1/2</text>
</svg>
