    <line x1="92" y1="161" x2="92" y2="167"/>
    <line x1="188" y1="161" x2="188" y2="167"/>
    <line x1="236" y1="161" x2="236" y2="167"/>
    <line x1="284" y1="161" x2="284" y2="167"/>
    <line x1="137" y1="68" x2="143" y2="68"/>
    <line x1="137" y1="116" x2="143" y2="116"/>
    <line x1="137" y1="212" x2="143" y2="212"/>
    <line x1="137" y1="260" x2="143" y2="260"/>
  </g>
  <g font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="middle">
    <text x="44" y="180">−4</text>
    <text x="92" y="180">−2</text>
    <text x="196" y="180">2</text>
    <text x="236" y="180">4</text>
    <text x="284" y="180">6</text>
    <text x="342" y="180" font-style="italic">x</text>
  </g>
  <g font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end">
    <text x="133" y="72">4</text>
    <text x="133" y="120">2</text>
    <text x="133" y="216">−2</text>
    <text x="133" y="264">−4</text>
    <text x="133" y="178">O</text>
  </g>
  <text x="148" y="16" font-family="Georgia,serif" font-size="13" fill="#334155" font-style="italic">y</text>
  <g font-family="Georgia,serif" font-size="12" fill="#b45309">
    <text x="20" y="133">y = 1</text>
    <text x="194" y="268">x = 2</text>
  </g>
  <g stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="14,143.3 20,143.4 44,144 68,144.8 92,146 116,148 140,152 152,156 164,164 170,172 176,188 178.4,200 180,212 180.8,220 182,236 183.2,260"/>
    <polyline points="192.8,20 194,44 195.2,60 196,68 197.6,80 200,92 202.4,100 206,108 212,116 224,124 236,128 260,132 284,134 308,135.2 332,136 346,136.4"/>
