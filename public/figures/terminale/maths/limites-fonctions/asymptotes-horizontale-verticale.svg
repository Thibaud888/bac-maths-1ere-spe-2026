<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" role="img" aria-label="Courbe de la fonction f définie par f(x) = 1 + 1/(x − 2), en deux morceaux. Les droites d'équations y = 1 et x = 2, en pointillés, sont ses asymptotes : à gauche de x = 2, la courbe reste juste sous y = 1 puis plonge vers le bas le long de x = 2 ; à droite, elle descend du haut le long de x = 2 puis se rapproche de y = 1 par au-dessus.">
  <!-- Origine du repère en (140, 164) ; une unité = 24 px sur les deux axes. -->
  <!-- Courbe : f(x) = 1 + 1/(x − 2), points calculés pour x de −5,25 à 1,8 puis de 2,2 à 8,58. -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <g stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="14" y1="140" x2="346" y2="140"/>
    <line x1="188" y1="10" x2="188" y2="272"/>
  </g>
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="14" y1="164" x2="346" y2="164"/>
    <polyline points="340,160 346,164 340,168"/>
    <line x1="140" y1="278" x2="140" y2="8"/>
    <polyline points="136,14 140,8 144,14"/>
  </g>
  <g stroke="#334155" stroke-width="1">
