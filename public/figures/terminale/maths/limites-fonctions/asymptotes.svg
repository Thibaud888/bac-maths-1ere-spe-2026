<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 335" width="360" height="335" role="img" aria-label="Courbe de la fonction f(x) = 2 + 1/(x − 1), en deux morceaux de part et d'autre de la droite verticale x = 1 ; les deux morceaux se rapprochent de la droite horizontale y = 2 quand x tend vers plus ou moins l'infini.">
