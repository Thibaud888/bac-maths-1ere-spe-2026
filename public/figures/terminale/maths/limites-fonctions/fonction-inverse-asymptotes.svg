<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" role="img" aria-label="Courbe de la fonction inverse, f(x) = 1/x, en deux morceaux. À droite de l'axe des ordonnées, elle descend du haut en longeant cet axe puis se rapproche de l'axe des abscisses par au-dessus ; à gauche, elle arrive juste sous l'axe des abscisses puis plonge vers le bas en longeant l'axe des ordonnées. Les deux axes sont ses asymptotes.">
  <!-- Origine du repère en (180, 145) ; une unité = 24 px sur les deux axes. -->
  <!-- Courbe : f(x) = 1/x, points calculés pour x de 0,1875 à 6,75 puis de −6,75 à −0,1875 (pixel : X = 180 + 24x, Y = 145 − 24/x). -->
  <!-- Graduations rangées dans les quadrants vides : la courbe occupe le haut à droite et le bas à gauche. -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="14" y1="145" x2="346" y2="145"/>
    <polyline points="340,141 346,145 340,149"/>
    <line x1="180" y1="278" x2="180" y2="8"/>
    <polyline points="176,14 180,8 184,14"/>
  </g>
  <g stroke="#334155" stroke-width="1">
    <line x1="36" y1="142" x2="36" y2="148"/>
    <line x1="84" y1="142" x2="84" y2="148"/>
    <line x1="132" y1="142" x2="132" y2="148"/>
    <line x1="228" y1="142" x2="228" y2="148"/>
    <line x1="276" y1="142" x2="276" y2="148"/>
    <line x1="324" y1="142" x2="324" y2="148"/>
    <line x1="177" y1="49" x2="183" y2="49"/>
    <line x1="177" y1="97" x2="183" y2="97"/>
    <line x1="177" y1="193" x2="183" y2="193"/>
    <line x1="177" y1="241" x2="183" y2="241"/>
  </g>
  <g font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="middle">
    <text x="36" y="137">−6</text>
    <text x="84" y="137">−4</text>
    <text x="132" y="137">−2</text>
    <text x="228" y="161">2</text>
    <text x="276" y="161">4</text>
    <text x="324" y="161">6</text>
    <text x="342" y="161" font-style="italic">x</text>
  </g>
  <g font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end">
    <text x="174" y="53">4</text>
    <text x="174" y="101">2</text>
    <text x="174" y="159">O</text>
  </g>
  <g font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="start">
    <text x="186" y="197">−2</text>
    <text x="186" y="245">−4</text>
  </g>
  <text x="166" y="16" font-family="Georgia,serif" font-size="13" fill="#334155" font-style="italic">y</text>
  <g font-family="Georgia,serif" font-size="12" fill="#b45309">
    <text x="172" y="34" text-anchor="end">asymptote x = 0</text>
    <text x="340" y="184" text-anchor="end">asymptote y = 0</text>
  </g>
  <g stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="184.5,17 184.8,25 186,49 187.2,65 188,73 189.6,85 192,97 195,106.6 198,113 204,121 210,125.8 216,129 228,133 240,135.4 252,137 276,139 300,140.2 324,141 342,141.4"/>
    <polyline points="18,148.6 36,149 60,149.8 84,151 108,153 120,154.6 132,157 144,161 150,164.2 156,169 162,177 165,183.4 168,193 170.4,205 172,217 172.8,225 174,241 175.2,265 175.5,273"/>
  </g>
  <text x="214" y="108" font-family="Georgia,serif" font-size="13" fill="#2563eb" font-style="italic">C<tspan font-size="10" dy="3">f</tspan></text>
</svg>
