<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-label="Deux repères côte à côte. À gauche, solutions de y' = 0,5y : les courbes de x ↦ 2e^(0,5x), x ↦ e^(0,5x) et x ↦ −e^(0,5x). Les deux premières sont au-dessus de l'axe des abscisses et montent de plus en plus vite vers la droite ; la troisième est au-dessous et descend de plus en plus vite. Vers la gauche, les trois courbes se rapprochent de l'axe des abscisses. Elles coupent l'axe des ordonnées en 2, 1 et −1. À droite, solutions de y' = −0,5y : les courbes symétriques des précédentes par rapport à l'axe des ordonnées, x ↦ 2e^(−0,5x), x ↦ e^(−0,5x) et x ↦ −e^(−0,5x), qui se rapprochent de l'axe des abscisses vers la droite.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Repère de gauche : origine (150, 170) ; 30 px par unité sur les deux axes. Repère de droite : origine (480, 170), même échelle. -->
  <!-- Courbes y = C e^(0,5x) pour x de −4 à 4 : arcs de Bézier cubiques d'Hermite (pas 1, pentes exactes y' = 0,5y), coupés au cadre. Le repère de droite reçoit les mêmes courbes, retournées par la symétrie x ↦ −x : ce sont les solutions de y' = −0,5y. -->
