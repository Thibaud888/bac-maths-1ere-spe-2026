<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 300" width="330" height="300" role="img" aria-label="Dans un repère orthonormé, quatre paraboles de même forme, empilées verticalement : les courbes des fonctions x ↦ x² − 1, x ↦ x², x ↦ x² + 1 et x ↦ x² + 2, pour x entre −1,6 et 1,6. Chacune se déduit de la courbe de x ↦ x² par une translation verticale. Au point d'abscisse 1 de chaque courbe, un court segment en pointillés montre la tangente : les quatre tangentes sont parallèles, de coefficient directeur 2.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Repère orthonormé : origine (170, 220) ; 40 px par unité sur les deux axes. -->
  <!-- Chaque parabole y = x² + C, pour x de −1,6 à 1,6, est une courbe de Bézier quadratique exacte : extrémités (±1,6 ; 2,56 + C), point de contrôle (0 ; C − 2,56). -->
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="30" y1="220" x2="315" y2="220"/><polyline points="309,216 315,220 309,224"/><line x1="170" y1="290" x2="170" y2="12"/><polyline points="166,18 170,12 174,18"/></g>
  <g stroke="#334155" stroke-width="1"><line x1="90" y1="217" x2="90" y2="223"/><line x1="130" y1="217" x2="130" y2="223"/><line x1="210" y1="217" x2="210" y2="223"/><line x1="250" y1="217" x2="250" y2="223"/><line x1="167" y1="260" x2="173" y2="260"/><line x1="167" y1="180" x2="173" y2="180"/><line x1="167" y1="140" x2="173" y2="140"/><line x1="167" y1="100" x2="173" y2="100"/><line x1="167" y1="60" x2="173" y2="60"/></g>
  <text x="90" y="236" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">−2</text>
  <!-- « −1 » calé à droite sur x = 132 (le chiffre tombe sous sa graduation) et « 1 » centré en 211 : tout près des graduations, sans toucher la courbe y = x² − 1 ni sa tangente. -->
  <text x="132" y="236" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">−1</text>
  <text x="211" y="236" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">1</text>
  <!-- Ordonnées : nombres calés à droite sur x = 153, à gauche de l'axe ; près de l'axe, chaque parabole passe au-dessus de son sommet (0 ; C), donc au-dessus du nombre. -->
  <text x="153" y="64" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">4</text>
  <text x="153" y="104" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">3</text>
  <text x="153" y="144" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">2</text>
  <text x="153" y="184" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">1</text>
  <text x="153" y="264" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">−1</text>
  <text x="250" y="236" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">2</text>
  <text x="164" y="234" font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">O</text>
  <text x="311" y="212" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end" font-style="italic">x</text>
  <text x="178" y="22" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="start" font-style="italic">y</text>
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M 106 37.6 Q 170 242.4 234 37.6" stroke="#7c3aed"/>
    <path d="M 106 77.6 Q 170 282.4 234 77.6" stroke="#16a34a"/>
    <path d="M 106 117.6 Q 170 322.4 234 117.6" stroke="#2563eb"/>
    <path d="M 106 157.6 Q 170 362.4 234 157.6" stroke="#ea580c"/>
  </g>
  <!-- Tangentes en x = 1 : pente 2, tracées de x = 0,7 à x = 1,3. -->
  <g stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3">
    <line x1="198" y1="124" x2="222" y2="76"/>
    <line x1="198" y1="164" x2="222" y2="116"/>
    <line x1="198" y1="204" x2="222" y2="156"/>
    <line x1="198" y1="244" x2="222" y2="196"/>
  </g>
  <circle cx="210" cy="100" r="3" fill="#7c3aed"/>
  <circle cx="210" cy="140" r="3" fill="#16a34a"/>
  <circle cx="210" cy="180" r="3" fill="#2563eb"/>
  <circle cx="210" cy="220" r="3" fill="#ea580c"/>
  <text x="240" y="42" font-family="Georgia,serif" font-size="12" fill="#7c3aed">y = x² + 2</text>
  <text x="240" y="82" font-family="Georgia,serif" font-size="12" fill="#16a34a">y = x² + 1</text>
  <text x="240" y="122" font-family="Georgia,serif" font-size="12" fill="#2563eb">y = x²</text>
  <text x="240" y="162" font-family="Georgia,serif" font-size="12" fill="#ea580c">y = x² − 1</text>
</svg>
