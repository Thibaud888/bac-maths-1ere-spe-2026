<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 265 342" width="265" height="342" role="img" aria-label="Trois courbes tracées dans un repère orthonormé muni d'un quadrillage d'une unité, pour x entre −2,5 et 2,4. La courbe C1, en orange et en pointillés, part d'environ (−2,5 ; 0,3), monte jusqu'à son maximum au point (0 ; 1), redescend en coupant l'axe des abscisses au point (1 ; 0), puis plonge vers le bas. La courbe C2, en bleu et en trait plein, part d'environ (−2,5 ; 0,4), passe par le point (0 ; 2), atteint son maximum, environ 2,7, en x = 1, coupe l'axe des abscisses au point (2 ; 0), puis plonge vers le bas. La courbe C3, en vert et en tirets, a la même forme que C2, deux unités plus bas : elle part d'environ (−2,5 ; −1,6), passe par l'origine du repère, atteint son maximum, environ 0,7, en x = 1, passe par le point (2 ; −2), puis plonge vers le bas.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Repère orthonormé : origine (135, 158) ; 45 px par unité sur les deux axes. Fenêtre : x de −2,5 à 2,4 ; y de −3,6 à 3,2. -->
  <!-- C1 : f(x) = (1 − x)e^x ; C2 : F(x) = (2 − x)e^x ; C3 : G(x) = (2 − x)e^x − 2. Points calculés tous les 0,05 en x. -->
  <defs><clipPath id="cadre-courbes-primitives"><rect x="22.5" y="14" width="220.5" height="306"/></clipPath></defs>
  <g stroke="#e2e8f0" stroke-width="1"><line x1="45" y1="14" x2="45" y2="320"/><line x1="90" y1="14" x2="90" y2="320"/><line x1="180" y1="14" x2="180" y2="320"/><line x1="225" y1="14" x2="225" y2="320"/><line x1="22.5" y1="23" x2="243" y2="23"/><line x1="22.5" y1="68" x2="243" y2="68"/><line x1="22.5" y1="113" x2="243" y2="113"/><line x1="22.5" y1="203" x2="243" y2="203"/><line x1="22.5" y1="248" x2="243" y2="248"/><line x1="22.5" y1="293" x2="243" y2="293"/></g>
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="22.5" y1="158" x2="256" y2="158"/><polyline points="250,154 256,158 250,162"/><line x1="135" y1="320" x2="135" y2="6"/><polyline points="131,12 135,6 139,12"/></g>
  <g stroke="#334155" stroke-width="1"><line x1="45" y1="155" x2="45" y2="161"/><line x1="90" y1="155" x2="90" y2="161"/><line x1="180" y1="155" x2="180" y2="161"/><line x1="225" y1="155" x2="225" y2="161"/><line x1="132" y1="23" x2="138" y2="23"/><line x1="132" y1="68" x2="138" y2="68"/><line x1="132" y1="113" x2="138" y2="113"/><line x1="132" y1="203" x2="138" y2="203"/><line x1="132" y1="248" x2="138" y2="248"/><line x1="132" y1="293" x2="138" y2="293"/></g>
  <!-- Nombres dans les marges (à gauche pour les ordonnées, en bas pour les abscisses), au bout des lignes du quadrillage : ils ne croisent aucune courbe. -->
  <g font-family="Georgia,serif" font-size="11" fill="#475569">
    <text x="17" y="27" text-anchor="end">3</text>
    <text x="17" y="72" text-anchor="end">2</text>
    <text x="17" y="117" text-anchor="end">1</text>
    <text x="17" y="162" text-anchor="end">0</text>
    <text x="17" y="207" text-anchor="end">−1</text>
    <text x="17" y="252" text-anchor="end">−2</text>
    <text x="17" y="297" text-anchor="end">−3</text>
    <text x="45" y="334" text-anchor="middle">−2</text>
    <text x="90" y="334" text-anchor="middle">−1</text>
    <text x="135" y="334" text-anchor="middle">0</text>
    <text x="180" y="334" text-anchor="middle">1</text>
    <text x="225" y="334" text-anchor="middle">2</text>
  </g>
  <text x="256" y="150" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end" font-style="italic">x</text>
  <text x="142" y="14" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="start" font-style="italic">y</text>
