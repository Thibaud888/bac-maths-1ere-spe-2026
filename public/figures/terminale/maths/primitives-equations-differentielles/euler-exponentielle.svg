<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-label="Dans un repère où les unités diffèrent sur les deux axes, pour x entre 0 et 2 : la courbe de la fonction exponentielle, en bleu, et la ligne brisée de la méthode d'Euler, en orange, pour l'équation y' = y avec y(0) = 1 et le pas 0,5. La ligne brisée part du point (0 ; 1), comme la courbe, puis passe par les points (0,5 ; 1,5), (1 ; 2,25), (1,5 ; 3,375) et (2 ; 5,0625). Elle reste sous la courbe, et l'écart grandit : en x = 2, la courbe est à e² ≈ 7,39, la ligne brisée à 5,0625. Un segment vertical en pointillés montre cet écart.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Repère : origine (50, 270) ; 100 px par unité en abscisse, 30 px par unité en ordonnée. -->
  <!-- Courbe y = e^x : arcs de Bézier cubiques d'Hermite (pas 0,5, pentes exactes y' = y). Ligne brisée : y(n+1) = y(n) + 0,5 × y(n) = 1,5 × y(n). -->
