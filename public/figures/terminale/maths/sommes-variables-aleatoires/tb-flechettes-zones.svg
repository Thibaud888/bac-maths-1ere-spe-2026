<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 310" width="320" height="310" role="img" aria-label="Dans un repère orthonormé, le carré OIKJ de côté 1, avec O(0 ; 0), I(1 ; 0), K(1 ; 1) et J(0 ; 1). La droite D d'équation y = x, en orange, joint O à K. La courbe C d'équation y = x³, en bleu, part de O en restant d'abord très proche de l'axe des abscisses, puis remonte vite jusqu'à K. La ZONE 1, au-dessus de la droite D, est le triangle OKJ, colorié en orange clair. La ZONE 2, sous la courbe C, est coloriée en bleu clair. La ZONE 3, entre la courbe C et la droite D, est coloriée en vert clair.">
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Repère : origine (50, 270) ; 220 px par unité sur chaque axe. -->
  <!-- Courbe y = x³ sur [0 ; 1] : Bézier cubique exacte, contrôles (1/3 ; 0) et (2/3 ; 0). -->
  <polygon points="50,270 270,50 50,50" fill="#ea580c" fill-opacity="0.14"/>
  <path d="M 50 270 L 270 50 C 196.67 270 123.33 270 50 270 Z" fill="#16a34a" fill-opacity="0.16"/>
  <path d="M 50 270 C 123.33 270 196.67 270 270 50 L 270 270 Z" fill="#2563eb" fill-opacity="0.16"/>
  <rect x="50" y="50" width="220" height="220" fill="none" stroke="#334155" stroke-width="1.3"/>
  <g stroke="#334155" stroke-width="1.5" fill="none"><line x1="35" y1="270" x2="305" y2="270"/><polyline points="299,266 305,270 299,274"/><line x1="50" y1="285" x2="50" y2="14"/><polyline points="46,20 50,14 54,20"/></g>
  <line x1="50" y1="270" x2="270" y2="50" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
  <path d="M 50 270 C 123.33 270 196.67 270 270 50" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
  <text x="44" y="285" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end">O</text>
  <text x="270" y="287" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="middle">I</text>
  <text x="276" y="46" font-family="Georgia,serif" font-size="12" fill="#475569">K</text>
  <text x="44" y="54" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end">J</text>
  <text x="302" y="262" font-family="Georgia,serif" font-size="12" fill="#475569" text-anchor="end" font-style="italic">x</text>
  <text x="58" y="22" font-family="Georgia,serif" font-size="12" fill="#475569" font-style="italic">y</text>
  <text x="140" y="160" font-family="Georgia,serif" font-size="13" fill="#ea580c" font-style="italic" text-anchor="middle">D</text>
  <text x="254" y="122" font-family="Georgia,serif" font-size="13" fill="#2563eb" font-style="italic" text-anchor="middle">C</text>
  <text x="115" y="115" font-family="Georgia,serif" font-size="11" fill="#9a3412" text-anchor="middle">ZONE 1</text>
  <text x="228" y="255" font-family="Georgia,serif" font-size="11" fill="#1e40af" text-anchor="middle">ZONE 2</text>
  <text x="172" y="190" font-family="Georgia,serif" font-size="11" fill="#166534" text-anchor="middle">ZONE 3</text>
</svg>
