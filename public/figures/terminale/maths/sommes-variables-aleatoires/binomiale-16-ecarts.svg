    <polyline points="356,216 362,220 356,224"/>
    <line x1="40" y1="220" x2="40" y2="32"/>
    <polyline points="36,38 40,32 44,38"/>
  </g>
  <g stroke="#334155" stroke-width="1">
    <line x1="52" y1="220" x2="52" y2="224"/>
