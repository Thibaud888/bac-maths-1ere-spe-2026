<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="380" height="260" role="img" aria-label="Diagramme en bâtons de la loi binomiale de paramètres 16 et 0,5, pour k de 0 à 16. Les bâtons sont symétriques autour de k = 8, le plus haut (environ 0,196), marqué par un trait pointillé μ = 8. Les bâtons de k = 4 à 12, en bleu, ont un écart à 8 inférieur ou égal à 4. Ceux de k = 2, 3, 13 et 14, en orange, ont un écart à 8 strictement supérieur à 4 : ils sont minuscules et totalisent environ 0,021. Les bâtons de 0, 1, 15 et 16 sont trop petits pour être vus.">
  <!-- Origine du repère en (40, 220) ; bâton k centré en x = 52 + 17,5k, largeur 9 ; une unité de probabilité = 800 px. -->
  <!-- Hauteurs : 800 × P(S = k), P(S = k) = C(16, k) / 65 536 : C(16, k) = 1, 16, 120, 560, 1820, 4368, 8008, 11440, 12870 pour k = 0 à 8. -->
  <!-- k = 0, 1, 15, 16 : moins de 0,2 px, non dessinés. Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="40" y1="180" x2="352" y2="180"/>
    <line x1="40" y1="140" x2="352" y2="140"/>
    <line x1="40" y1="100" x2="352" y2="100"/>
    <line x1="40" y1="60" x2="352" y2="60"/>
  </g>
  <line x1="192" y1="220" x2="192" y2="46" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>
  <g fill="#f59e0b">
    <rect x="82.5" y="218.5" width="9" height="1.5"/>
    <rect x="100" y="213.2" width="9" height="6.8"/>
    <rect x="275" y="213.2" width="9" height="6.8"/>
    <rect x="292.5" y="218.5" width="9" height="1.5"/>
  </g>
  <g fill="#60a5fa">
    <rect x="117.5" y="197.8" width="9" height="22.2"/>
    <rect x="135" y="166.7" width="9" height="53.3"/>
    <rect x="152.5" y="122.2" width="9" height="97.8"/>
