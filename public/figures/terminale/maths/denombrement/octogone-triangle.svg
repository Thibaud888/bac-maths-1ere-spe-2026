<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" role="img" aria-label="Octogone régulier ABCDEFGH avec deux diagonales en pointillé et le triangle ABE en couleur">
  <!-- Octogone régulier de centre (180, 170) et de rayon 125 ; sommets nommés dans le sens des aiguilles d'une montre. -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->

  <!-- Triangle ABE (un seul côté commun avec l'octogone : [AB]) -->
  <polygon points="132.2,54.5 227.8,54.5 227.8,285.5" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Deux diagonales en pointillé : [CH] et [DG] -->
  <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="295.5" y1="122.2" x2="64.5" y2="122.2"/>
    <line x1="295.5" y1="217.8" x2="64.5" y2="217.8"/>
  </g>

  <!-- Côtés de l'octogone -->
  <polygon points="132.2,54.5 227.8,54.5 295.5,122.2 295.5,217.8 227.8,285.5 132.2,285.5 64.5,217.8 64.5,122.2" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>

  <!-- Sommets -->
  <g fill="#334155">
    <circle cx="132.2" cy="54.5" r="3.5"/>
    <circle cx="227.8" cy="54.5" r="3.5"/>
    <circle cx="295.5" cy="122.2" r="3.5"/>
    <circle cx="295.5" cy="217.8" r="3.5"/>
    <circle cx="227.8" cy="285.5" r="3.5"/>
    <circle cx="132.2" cy="285.5" r="3.5"/>
    <circle cx="64.5" cy="217.8" r="3.5"/>
    <circle cx="64.5" cy="122.2" r="3.5"/>
  </g>

  <!-- Noms des sommets -->
  <g font-family="Georgia,serif" font-size="16" fill="#334155" text-anchor="middle">
    <text x="124.1" y="40.1">A</text>
    <text x="235.9" y="40.1">B</text>
    <text x="314.9" y="119.1">C</text>
    <text x="314.9" y="230.9">D</text>
    <text x="235.9" y="309.9">E</text>
    <text x="124.1" y="309.9">F</text>
    <text x="45.1" y="230.9">G</text>
    <text x="45.1" y="119.1">H</text>
  </g>
</svg>
