<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 230" width="330" height="230" role="img" aria-label="Quadrillage de 5 unités sur 3 avec les points A(0;0), C(2;1) et B(5;3), et le trajet DDHDHDDH en couleur">
  <!-- Origine du repère en (45, 185) ; une unité = 50 px. -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->

  <!-- Quadrillage -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="45" y1="185" x2="295" y2="185"/>
    <line x1="45" y1="135" x2="295" y2="135"/>
    <line x1="45" y1="85" x2="295" y2="85"/>
    <line x1="45" y1="35" x2="295" y2="35"/>
    <line x1="45" y1="35" x2="45" y2="185"/>
    <line x1="95" y1="35" x2="95" y2="185"/>
    <line x1="145" y1="35" x2="145" y2="185"/>
    <line x1="195" y1="35" x2="195" y2="185"/>
    <line x1="245" y1="35" x2="245" y2="185"/>
    <line x1="295" y1="35" x2="295" y2="185"/>
  </g>

  <!-- Graduations -->
  <g font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="middle">
    <text x="45" y="202">0</text>
    <text x="95" y="202">1</text>
    <text x="145" y="202">2</text>
    <text x="195" y="202">3</text>
    <text x="245" y="202">4</text>
    <text x="295" y="202">5</text>
  </g>
  <g font-family="Georgia,serif" font-size="11" fill="#475569" text-anchor="end">
    <text x="36" y="139">1</text>
    <text x="36" y="89">2</text>
    <text x="36" y="39">3</text>
  </g>

  <!-- Trajet D D H D H D D H : (0;0) (1;0) (2;0) (2;1) (3;1) (3;2) (4;2) (5;2) (5;3) -->
  <polyline points="45,185 95,185 145,185 145,135 195,135 195,85 245,85 295,85 295,35" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Points A, C, B -->
  <g fill="#334155">
    <circle cx="45" cy="185" r="5"/>
    <circle cx="145" cy="135" r="5"/>
    <circle cx="295" cy="35" r="5"/>
  </g>
  <g font-family="Georgia,serif" font-size="16" fill="#334155">
    <text x="22" y="222">A(0 ; 0)</text>
    <text x="151" y="158">C(2 ; 1)</text>
    <text x="238" y="22">B(5 ; 3)</text>
  </g>
</svg>
