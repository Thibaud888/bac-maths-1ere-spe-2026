<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="360" height="270" role="img" aria-label="Un plan P dessiné en perspective comme un parallélogramme bleu. Le point M est au-dessus du plan. La droite Δ passe par M et descend tout droit jusqu'au point H du plan, avec un angle droit marqué en H ; elle continue sous le plan, en pointillé tant qu'elle est cachée par le plan. Sur la droite, à partir de M, une flèche orange : le vecteur normal n, qui dirige Δ.">
  <!-- Droite Δ passant par M et dirigée par le vecteur normal n : elle coupe le plan P en H, projeté orthogonal de M. Fond transparent. -->
  <polygon points="30,225 250,225 330,155 110,155" fill="#2563eb" fill-opacity="0.10" stroke="#334155" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="52" y="216" font-family="Georgia,serif" font-size="16" fill="#334155" text-anchor="middle" font-style="italic">P</text>
  <line x1="180" y1="20" x2="180" y2="192" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="180" y1="192" x2="180" y2="225" stroke="#334155" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="180" y1="225" x2="180" y2="256" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="180" y1="70" x2="180" y2="108" stroke="#b45309" stroke-width="3.2" stroke-linecap="butt"/>
  <polygon points="180,119 175.5,108 184.5,108" fill="#b45309"/>
  <polyline points="180,181 191,181 191,192" fill="none" stroke="#334155" stroke-width="1.3"/>
  <circle cx="180" cy="70" r="3.5" fill="#334155"/>
  <circle cx="180" cy="192" r="3.5" fill="#b45309"/>
  <text x="194" y="32" font-family="Georgia,serif" font-size="16" fill="#334155" text-anchor="middle">Δ</text>
  <text x="165" y="68" font-family="Georgia,serif" font-size="16" fill="#334155" text-anchor="middle" font-style="italic">M</text>
  <text x="165" y="208" font-family="Georgia,serif" font-size="16" fill="#b45309" text-anchor="middle" font-style="italic">H</text>
  <text x="198" y="102" font-family="Georgia,serif" font-size="16" fill="#b45309" text-anchor="middle" font-style="italic">n</text>
  <line x1="193" y1="88.5" x2="202" y2="88.5" stroke="#b45309" stroke-width="1.2" stroke-linecap="butt"/>
  <polygon points="205,88.5 201,85.9 201,91.1" fill="#b45309"/>
</svg>
