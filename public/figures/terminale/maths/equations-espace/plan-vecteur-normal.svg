<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="380" height="250" role="img" aria-label="Un plan P dessiné en perspective comme un parallélogramme bleu. Le point A est dans le plan ; de A part, vers le haut, une flèche orange : le vecteur normal n. Un autre point M du plan est relié à A par une flèche bleue tracée dans le plan : le vecteur AM. Un angle droit est marqué en A entre n et AM.">
  <!-- Plan P passant par A, vecteur normal n en A, point M du plan : AM orthogonal à n. Fond transparent. -->
  <polygon points="30,215 260,215 350,140 120,140" fill="#2563eb" fill-opacity="0.10" stroke="#334155" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="55" y="206" font-family="Georgia,serif" font-size="16" fill="#334155" text-anchor="middle" font-style="italic">P</text>
  <line x1="150" y1="190" x2="259.2" y2="171.8" stroke="#2563eb" stroke-width="2.6" stroke-linecap="butt"/>
  <polygon points="270,170 259.9,176.3 258.4,167.4" fill="#2563eb"/>
  <line x1="150" y1="190" x2="150" y2="86" stroke="#b45309" stroke-width="2.6" stroke-linecap="butt"/>
  <polygon points="150,75 145.5,86 154.5,86" fill="#b45309"/>
  <polyline points="150,178 161.8,176 161.8,188" fill="none" stroke="#334155" stroke-width="1.3"/>
  <circle cx="150" cy="190" r="3.5" fill="#334155"/>
  <circle cx="270" cy="170" r="3.5" fill="#334155"/>
  <text x="140" y="207" font-family="Georgia,serif" font-size="16" fill="#334155" text-anchor="middle" font-style="italic">A</text>
  <text x="285" y="186" font-family="Georgia,serif" font-size="16" fill="#334155" text-anchor="middle" font-style="italic">M</text>
  <text x="168" y="102" font-family="Georgia,serif" font-size="16" fill="#b45309" text-anchor="middle" font-style="italic">n</text>
  <line x1="163" y1="88.5" x2="172" y2="88.5" stroke="#b45309" stroke-width="1.2" stroke-linecap="butt"/>
  <polygon points="175,88.5 171,85.9 171,91.1" fill="#b45309"/>
  <text x="208" y="170" font-family="Georgia,serif" font-size="15" fill="#2563eb" text-anchor="middle" font-style="italic">AM</text>
  <line x1="196" y1="156" x2="217" y2="156" stroke="#2563eb" stroke-width="1.2" stroke-linecap="butt"/>
  <polygon points="220,156 216,153.4 216,158.6" fill="#2563eb"/>
</svg>
