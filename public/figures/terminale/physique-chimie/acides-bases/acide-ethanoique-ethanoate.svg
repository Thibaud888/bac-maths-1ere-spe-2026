<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Couple acide éthanoïque / ion éthanoate : schémas de Lewis en haut, formules semi-développées en bas. En couleur, l'atome H échangé, le doublet non liant qu'il laisse sur l'oxygène et la charge négative de l'ion.">
  <!-- Rangée du haut : schémas de Lewis (symboles en 22 px, centrés en y = 50, 110, 170 ; ligne de base = centre + 8). -->
  <!-- Rangée du bas : formules semi-développées (19 px, centre en y = 218, 250, 282). En bas : les noms. -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Traits #334155 ; en violet #7c3aed, ce qui change entre l'acide et sa base conjuguée. -->

  <!-- ===== Acide éthanoïque CH3-COOH : schéma de Lewis (panneau de gauche) ===== -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- C1 (90 ; 110) et ses trois H -->
    <line x1="90" y1="97" x2="90" y2="64"/>
    <line x1="90" y1="123" x2="90" y2="156"/>
    <line x1="77" y1="110" x2="54" y2="110"/>
    <!-- C1-C2 -->
    <line x1="103" y1="110" x2="147" y2="110"/>
    <!-- C2=O1 (double liaison vers le haut) -->
    <line x1="156.5" y1="97" x2="156.5" y2="64"/>
    <line x1="163.5" y1="97" x2="163.5" y2="64"/>
    <!-- C2-O2 -->
    <line x1="173" y1="110" x2="212" y2="110"/>
  </g>
  <!-- Doublets non liants : deux sur O1, deux sur O2 -->
  <g stroke="#334155" stroke-width="2.5" stroke-linecap="round">
    <line x1="146" y1="42" x2="146" y2="58"/>
    <line x1="174" y1="42" x2="174" y2="58"/>
    <line x1="217" y1="94" x2="233" y2="94"/>
    <line x1="217" y1="126" x2="233" y2="126"/>
  </g>
  <!-- Liaison O2-H : l'atome H qui sera cédé -->
  <line x1="238" y1="110" x2="272" y2="110" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <g font-family="sans-serif" font-size="22" fill="#334155" text-anchor="middle">
    <text x="90" y="58">H</text>
    <text x="40" y="118">H</text>
    <text x="90" y="178">H</text>
    <text x="90" y="118">C</text>
    <text x="160" y="118">C</text>
    <text x="160" y="58">O</text>
    <text x="225" y="118">O</text>
  </g>
  <text x="285" y="118" font-family="sans-serif" font-size="22" fill="#7c3aed" text-anchor="middle">H</text>

  <!-- ===== Passage de l'acide à la base : - H+ ; retour : + H+ ===== -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round">
    <line x1="306" y1="132" x2="370" y2="132"/>
    <line x1="316" y1="156" x2="380" y2="156"/>
  </g>
  <g fill="#334155">
    <polygon points="380,132 369,127 369,137"/>
    <polygon points="306,156 317,151 317,161"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#7c3aed" text-anchor="middle">
    <text x="343" y="121">− H<tspan dy="-7" font-size="12">+</tspan></text>
    <text x="343" y="181">+ H<tspan dy="-7" font-size="12">+</tspan></text>
  </g>

  <!-- ===== Ion éthanoate CH3-COO- : schéma de Lewis (panneau de droite, décalé de 360) ===== -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="450" y1="97" x2="450" y2="64"/>
    <line x1="450" y1="123" x2="450" y2="156"/>
    <line x1="437" y1="110" x2="414" y2="110"/>
    <line x1="463" y1="110" x2="507" y2="110"/>
    <line x1="516.5" y1="97" x2="516.5" y2="64"/>
    <line x1="523.5" y1="97" x2="523.5" y2="64"/>
    <line x1="533" y1="110" x2="572" y2="110"/>
  </g>
  <g stroke="#334155" stroke-width="2.5" stroke-linecap="round">
    <line x1="506" y1="42" x2="506" y2="58"/>
    <line x1="534" y1="42" x2="534" y2="58"/>
    <line x1="577" y1="94" x2="593" y2="94"/>
    <line x1="577" y1="126" x2="593" y2="126"/>
  </g>
  <!-- Troisième doublet non liant de O2 (ancien doublet de la liaison O-H) et charge négative entourée -->
  <line x1="599" y1="102" x2="599" y2="118" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="608" cy="86" r="8" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="603.5" y1="86" x2="612.5" y2="86" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/>
  <g font-family="sans-serif" font-size="22" fill="#334155" text-anchor="middle">
    <text x="450" y="58">H</text>
    <text x="400" y="118">H</text>
    <text x="450" y="178">H</text>
    <text x="450" y="118">C</text>
    <text x="520" y="118">C</text>
    <text x="520" y="58">O</text>
    <text x="585" y="118">O</text>
  </g>

  <!-- ===== Formules semi-développées ===== -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- acide : CH3-C, C=O (vers le haut à droite), C-OH (vers le bas à droite) -->
    <line x1="126" y1="250" x2="148" y2="250"/>
    <line x1="166.0" y1="239.5" x2="181.1" y2="226.1"/>
    <line x1="169.4" y1="243.3" x2="184.5" y2="230.0"/>
    <line x1="167.7" y1="258.6" x2="182.8" y2="272.0"/>
    <!-- ion : mêmes liaisons, décalées de 360 -->
    <line x1="486" y1="250" x2="508" y2="250"/>
    <line x1="526.0" y1="239.5" x2="541.1" y2="226.1"/>
    <line x1="529.4" y1="243.3" x2="544.5" y2="230.0"/>
    <line x1="527.7" y1="258.6" x2="542.8" y2="272.0"/>
  </g>
  <g font-family="sans-serif" font-size="19" fill="#334155">
    <text x="120" y="257" text-anchor="end">CH<tspan dy="5" font-size="13">3</tspan></text>
    <text x="158" y="257" text-anchor="middle">C</text>
    <text x="194" y="225" text-anchor="middle">O</text>
    <text x="187" y="289">O<tspan fill="#7c3aed">H</tspan></text>
    <text x="480" y="257" text-anchor="end">CH<tspan dy="5" font-size="13">3</tspan></text>
    <text x="518" y="257" text-anchor="middle">C</text>
    <text x="554" y="225" text-anchor="middle">O</text>
    <text x="547" y="289">O<tspan dy="-8" font-size="14" fill="#7c3aed">−</tspan></text>
  </g>

  <!-- ===== Noms ===== -->
  <g font-family="sans-serif" font-size="15" fill="#334155" text-anchor="middle">
    <text x="160" y="325">Acide éthanoïque</text>
    <text x="505" y="325">Ion éthanoate</text>
  </g>
</svg>
