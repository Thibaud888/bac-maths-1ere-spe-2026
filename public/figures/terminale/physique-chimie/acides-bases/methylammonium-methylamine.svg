<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 315" width="520" height="315" role="img" aria-label="Couple ion méthylammonium / méthylamine : schémas de Lewis en haut, formules semi-développées en bas. En couleur, l'atome H échangé et la charge positive de l'ion, puis le doublet non liant de l'azote dans l'amine.">
  <!-- Rangée du haut : schémas de Lewis (symboles en 22 px, centrés en y = 50, 110, 170 ; ligne de base = centre + 8). -->
  <!-- Rangée du bas : formules semi-développées (19 px, centre en y = 250). En bas : les noms. -->
  <!-- Fond transparent : en thème sombre, l'image est inversée par ImageFigure. -->
  <!-- Traits #334155 ; en violet #7c3aed, ce qui change entre l'acide et sa base conjuguée. -->

  <!-- ===== Ion méthylammonium CH3-NH3+ : schéma de Lewis (panneau de gauche) ===== -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- C (90 ; 110) et ses trois H -->
    <line x1="90" y1="97" x2="90" y2="64"/>
    <line x1="90" y1="123" x2="90" y2="156"/>
    <line x1="77" y1="110" x2="54" y2="110"/>
    <!-- C-N -->
    <line x1="103" y1="110" x2="147" y2="110"/>
    <!-- N (160 ; 110) : deux N-H en noir -->
    <line x1="160" y1="97" x2="160" y2="64"/>
    <line x1="160" y1="123" x2="160" y2="156"/>
  </g>
  <!-- Quatrième liaison N-H : l'atome H qui sera cédé -->
  <line x1="173" y1="110" x2="212" y2="110" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <!-- Charge positive entourée, portée par l'azote -->
  <circle cx="183" cy="87" r="8" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
  <g stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round">
    <line x1="178.5" y1="87" x2="187.5" y2="87"/>
    <line x1="183" y1="82.5" x2="183" y2="91.5"/>
  </g>
  <g font-family="sans-serif" font-size="22" fill="#334155" text-anchor="middle">
    <text x="90" y="58">H</text>
    <text x="40" y="118">H</text>
    <text x="90" y="178">H</text>
    <text x="90" y="118">C</text>
    <text x="160" y="118">N</text>
    <text x="160" y="58">H</text>
    <text x="160" y="178">H</text>
  </g>
  <text x="225" y="118" font-family="sans-serif" font-size="22" fill="#7c3aed" text-anchor="middle">H</text>

  <!-- ===== Passage de l'acide à la base : - H+ ; retour : + H+ ===== -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round">
    <line x1="246" y1="132" x2="310" y2="132"/>
    <line x1="256" y1="156" x2="320" y2="156"/>
  </g>
  <g fill="#334155">
    <polygon points="320,132 309,127 309,137"/>
    <polygon points="246,156 257,151 257,161"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#7c3aed" text-anchor="middle">
    <text x="283" y="121">− H<tspan dy="-7" font-size="12">+</tspan></text>
    <text x="283" y="181">+ H<tspan dy="-7" font-size="12">+</tspan></text>
  </g>

  <!-- ===== Méthylamine CH3-NH2 : schéma de Lewis (panneau de droite, décalé de 300) ===== -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="390" y1="97" x2="390" y2="64"/>
    <line x1="390" y1="123" x2="390" y2="156"/>
    <line x1="377" y1="110" x2="354" y2="110"/>
    <line x1="403" y1="110" x2="447" y2="110"/>
    <line x1="460" y1="97" x2="460" y2="64"/>
    <line x1="460" y1="123" x2="460" y2="156"/>
  </g>
  <!-- Doublet non liant de l'azote (il devient la liaison N-H dans l'ion) -->
  <line x1="474" y1="102" x2="474" y2="118" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <g font-family="sans-serif" font-size="22" fill="#334155" text-anchor="middle">
    <text x="390" y="58">H</text>
    <text x="340" y="118">H</text>
    <text x="390" y="178">H</text>
    <text x="390" y="118">C</text>
    <text x="460" y="118">N</text>
    <text x="460" y="58">H</text>
    <text x="460" y="178">H</text>
  </g>

  <!-- ===== Formules semi-développées ===== -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="126" y1="250" x2="148" y2="250"/>
    <line x1="426" y1="250" x2="448" y2="250"/>
  </g>
  <g font-family="sans-serif" font-size="19" fill="#334155">
    <text x="120" y="257" text-anchor="end">CH<tspan dy="5" font-size="13">3</tspan></text>
    <text x="152" y="257">NH<tspan dy="5" font-size="13">3</tspan><tspan dy="-13" font-size="13" fill="#7c3aed">+</tspan></text>
    <text x="420" y="257" text-anchor="end">CH<tspan dy="5" font-size="13">3</tspan></text>
    <text x="452" y="257">NH<tspan dy="5" font-size="13">2</tspan></text>
  </g>

  <!-- ===== Noms ===== -->
  <g font-family="sans-serif" font-size="15" fill="#334155" text-anchor="middle">
    <text x="135" y="298">Ion méthylammonium</text>
    <text x="410" y="298">Méthylamine</text>
  </g>
</svg>
